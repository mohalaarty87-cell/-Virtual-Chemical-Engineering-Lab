<title>محاكي السيطرة على الحرارة PCT-M4 | PCT-M4 Temperature Control Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4eaee; --stage-a:#f3f6f8; --stage-b:#d2dce2; --panel:#f7f9fa; --ink:#1b2830; --muted:#5a6a75;
  --line:#c9d4db; --chip:#ffffff; --accent:#b85f1e; --accent-ink:#ffffff; --cool:#2f76b3; --tint:#edf2f5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;
    --line:#2c3a44; --chip:#21303a; --accent:#e0873d; --accent-ink:#1a1108; --cool:#5d9fd5; --tint:#1e2a32;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;
  --line:#2c3a44; --chip:#21303a; --accent:#e0873d; --accent-ink:#1a1108; --cool:#5d9fd5; --tint:#1e2a32;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif; font-size:15px; line-height:1.7}
button{font:inherit; color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{display:grid; grid-template-columns:minmax(300px,370px) 1fr; height:100%}
.panel{background:var(--panel); border-inline-end:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column}
.ph{padding:22px 22px 14px}
.ph h1{margin:0; font-size:21px; line-height:1.4; font-weight:700}
.ph .sub{margin:2px 0 0; color:var(--muted); font-size:13.5px; direction:ltr; text-align:right}

.card{margin:0 16px; padding:16px 18px; background:var(--tint); border-radius:12px; border:1px solid var(--line)}
.card h2{margin:0; font-size:18px; font-weight:600; line-height:1.45}
.card .en{margin:0 0 8px; color:var(--muted); font-size:13px; direction:ltr; text-align:right}
.card p{margin:6px 0}
.card .eq{margin-top:10px; padding:8px 10px; border-inline-start:3px solid var(--accent); background:var(--panel); border-radius:0 6px 6px 0; font-size:14px; unicode-bidi:plaintext}
.card .head{display:flex; gap:10px; align-items:flex-start}
.card .head .num{flex:none; margin-top:3px}
.card .act{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
.card .act button{background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13.5px}
.card .act button:hover{border-color:var(--accent)}

.num{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; font-size:12.5px; font-weight:600;
  background:var(--chip); border:1.5px solid var(--ink); line-height:1; font-variant-numeric:tabular-nums}

.mix{padding:18px 22px 6px}
.mix h3,.parts h3{margin:0 0 6px; font-size:15px; font-weight:600}
.rpm{display:flex; align-items:center; gap:12px}
.rpm input{flex:1; accent-color:var(--accent)}
.rpm output{min-width:86px; font-weight:600; font-variant-numeric:tabular-nums}
.readout{display:grid; grid-template-columns:1fr auto; gap:2px 12px; margin:10px 0 4px; font-size:14px}
.readout dt{color:var(--muted)}
.readout dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums; direction:ltr; text-align:left}
.fine{font-size:12.5px; color:var(--muted); margin:6px 0 0}

.parts{padding:14px 14px 8px}
.parts h3{padding:10px 8px 2px; color:var(--muted); font-size:13px}
.parts ul{list-style:none; margin:0; padding:0}
.parts li button{display:flex; align-items:center; gap:10px; width:100%; text-align:right; background:none; border:0;
  padding:5px 8px; border-radius:8px; cursor:pointer; font-size:14.5px}
.parts li button:hover{background:var(--tint)}
.parts li button[aria-current="true"]{background:var(--tint); box-shadow:inset -3px 0 0 var(--accent)}
.parts li button[aria-current="true"] .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lang{display:inline-block; cursor:pointer; background:none; font:inherit; margin-top:8px; font-size:13.5px; color:var(--accent); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:2px 10px}
.lang:hover{border-color:var(--accent)}
.credit{margin-top:auto; padding:14px 22px 20px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line)}
.credit b{color:var(--ink); font-weight:600}

.stage{position:relative; overflow:hidden; background:radial-gradient(ellipse 70% 65% at 50% 42%, var(--stage-a), var(--stage-b))}
#c{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
#c:active{cursor:grabbing}
.labels{position:absolute; inset:0; pointer-events:none}
.lbl{direction:ltr; position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0; border:0; background:none; cursor:pointer; white-space:nowrap}
.lbl .t{direction:rtl; display:none; background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:12.5px; box-shadow:0 1px 3px rgba(20,30,40,.18)}
.labels.names .lbl .t,.lbl.on .t{display:inline-block}
.lbl .num{box-shadow:0 1px 3px rgba(20,30,40,.25)}
.lbl.on .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lbl.on .t{border-color:var(--accent)}
.labels.off .lbl:not(.on){display:none}

.ovl{position:absolute; top:14px; inset-inline-start:16px; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:8px}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-radius:10px; padding:5px 12px; font-size:13px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:11px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.legend b{font-weight:500}
.tb.rx{background:#1f8a4c; color:#fff; border-color:#1f8a4c; font-weight:600}
.tb.rx[aria-pressed="true"]{background:#b3362b; border-color:#b3362b; color:#fff}
.rxbar{display:flex; height:12px; border-radius:6px; overflow:hidden; margin:8px 0 4px; background:var(--line)}
.rxbar div{transition:width .25s linear}
.brand{ background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-inline-start:4px solid var(--accent); border-radius:10px; padding:8px 14px 9px}
.brand .who{font-size:17px; font-weight:700; line-height:1.4}
.brand .en{font-size:13px; color:var(--muted); direction:ltr; text-align:right}
.brand .org{font-size:12.5px; color:var(--muted)}
.hint{position:absolute; top:14px; inset-inline-end:16px; max-width:300px; font-size:13px; color:var(--muted); pointer-events:none}
.toolbar{position:absolute; bottom:14px; inset-inline:14px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; pointer-events:none}
.toolbar > *{pointer-events:auto}
.tb{background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:6px 13px; cursor:pointer; font-size:13.5px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.tb:hover{border-color:var(--accent)}
.tb[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.seg{display:inline-flex; background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:2px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.seg button{border:0; background:none; padding:4px 11px; border-radius:7px; cursor:pointer; font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:15px; padding:20px; text-align:center}

html[dir="ltr"] .ph .sub,html[dir="ltr"] .card .en,html[dir="ltr"] .brand .en{direction:rtl; text-align:left}
html[dir="ltr"] .readout dd{text-align:right}
html[dir="rtl"] #oReg{direction:rtl}
html[dir="ltr"] .parts li button{text-align:left}
html[dir="ltr"] .parts li button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
html[dir="ltr"] .lbl .t{direction:ltr}
html[dir="ltr"] .card .eq{border-radius:0 6px 6px 0}
html[dir="rtl"] .card .eq{border-radius:6px 0 0 6px}
@media (max-width:820px){
  html,body{height:auto}
  .app{grid-template-columns:1fr; height:auto}
  .stage{order:-1; height:66svh; min-height:380px}
  .panel{border-inline-end:0; overflow:visible}
  .hint{display:none}
  .ovl{top:10px; inset-inline-start:10px}
  .brand{padding:6px 10px}
  .legend{font-size:12px; padding:4px 9px}
  .brand .who{font-size:15px}
  .brand .org{display:none}
  .toolbar{bottom:10px; gap:6px}
  .tb,.seg button{font-size:12.5px}
}
.prof-h{margin-top:14px !important}
.prof{display:grid; grid-template-columns:auto 1fr auto; gap:3px 8px; align-items:center; font-size:12.5px; font-variant-numeric:tabular-nums}
.prof .k{color:var(--muted)}
.prof .tr{height:9px; background:var(--line); border-radius:5px; overflow:hidden}
.prof .tr div{height:100%; border-radius:5px; transition:width .3s}
.prof .v{direction:ltr}
.legend i.grad{width:34px; border-radius:6px; background:linear-gradient(90deg,#f2c21b,#e23b32)}
html[dir="rtl"] .legend i.grad{background:linear-gradient(270deg,#f2c21b,#e23b32)}
.legend i.bub{background:transparent; box-shadow:inset 0 0 0 2px #e9844a}
@media (max-width:820px){
  .stage{height:auto; min-height:0; display:flex; flex-direction:column}
  #c{height:60svh; min-height:340px; flex:none}
  .toolbar{position:static; inset:auto; padding:10px 10px 12px; background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .labels{bottom:auto; height:max(60svh,340px)}
}
.tb.fl{border-color:#b3362b; color:#b3362b; font-weight:600}
.tb.fl[aria-pressed="true"]{background:#b3362b; color:#fff}
.fwarn{background:#b3362b; color:#fff; border-radius:10px; padding:6px 12px; font-size:13.5px; font-weight:600; max-width:340px; box-shadow:0 2px 8px rgba(120,20,10,.3)}
.fwarn[hidden]{display:none}
.card.fcard{border-color:#b3362b; border-inline-start:4px solid #b3362b}
.card.fcard h2{color:#b3362b}
.card ul{margin:6px 0; padding-inline-start:20px}
.card li{margin:2px 0}
.card h4{margin:10px 0 2px; font-size:14.5px}
#chart svg{width:100%; height:auto; display:block}
#chart text{font-size:10px; fill:var(--muted); font-family:inherit}
.ch-leg{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--muted); margin-top:4px}
.ch-leg i{display:inline-block; width:16px; height:3px; border-radius:2px; vertical-align:middle; margin-inline-end:5px}
.fwarn.ok{background:#1f8a4c}
.legend i.sw{width:34px; border-radius:6px; background:linear-gradient(90deg,#ff3b1f,#1f5fff)}
.legend i.gw{width:34px; border-radius:6px; background:linear-gradient(90deg,#9be38a,#f4f4f4)}
html[dir="rtl"] .legend i.sw{background:linear-gradient(270deg,#ff3b1f,#1f5fff)}
html[dir="rtl"] .legend i.gw{background:linear-gradient(270deg,#9be38a,#f4f4f4)}
.pkseg{display:flex; width:100%}
.pkseg button{flex:1; padding:6px 3px; font-size:12.5px}
#chart2 svg{width:100%;height:auto;display:block;margin-top:8px}#chart2 text{font-size:10px;fill:var(--muted);font-family:inherit}
#chart svg,#chart2 svg,#chart3 svg{width:100%;height:auto;display:block;margin-top:8px}#chart text,#chart2 text,#chart3 text{font-size:10px;fill:var(--muted);font-family:inherit}
.fwarn.bad{background:#c8352e}

#tbl table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}#tbl th,#tbl td{border:1px solid rgba(128,128,128,.35);padding:2px 4px;text-align:center}#tbl th{background:rgba(31,78,120,.25)}#tbl .osc{color:#c8352e;font-weight:700}

#tbl .sc{max-height:170px;overflow:auto;border:1px solid rgba(128,128,128,.35)}#tbl .sc table{margin:0}

#chart3 svg{margin-bottom:2px}
.presenter{position:absolute; top:12px; inset-inline-end:12px; width:min(290px,calc(100% - 24px)); display:flex; gap:9px; align-items:flex-start; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:8px 9px; box-shadow:0 4px 16px rgba(10,20,30,.2); z-index:5}
.presenter[hidden]{display:none}
.pv{position:relative; flex:none; width:52px; height:52px}
.pv img{width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:50% 30%; position:relative; z-index:1; border:2px solid var(--panel)}
.pv .ring{position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(#1f8a4c,#1f78c8,#1f8a4c); opacity:.35}
.presenter.talking .pv img{animation:talk 2.4s ease-in-out infinite}
.presenter.talking .pv .ring{opacity:1; animation:spin 3s linear infinite}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-1px) scale(1.02) rotate(-.6deg)}50%{transform:translateY(0) scale(1.005)}75%{transform:translateY(-1px) scale(1.015) rotate(.6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pv .bars{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:2; background:var(--panel); border-radius:6px; padding:2px 4px; border:1px solid var(--line)}
.pv .bars i{display:block; width:2px; height:4px; background:#1f8a4c; border-radius:2px}
.presenter.talking .bars i{animation:bar .9s ease-in-out infinite}
.presenter.talking .bars i:nth-child(2){animation-delay:.15s}.presenter.talking .bars i:nth-child(3){animation-delay:.3s}.presenter.talking .bars i:nth-child(4){animation-delay:.45s}.presenter.talking .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:3px}50%{height:10px}}
.pb{flex:1; min-width:0}
.pn{font-weight:700; font-size:12.5px; line-height:1.3}
.pn span{font-weight:500; color:var(--muted); font-size:11.5px; margin-inline-start:4px}
.pt{font-size:12.5px; line-height:1.6; margin:3px 0 5px; max-height:4.9em; overflow-y:auto}
.pc{display:flex; gap:4px}
.pc .ic{background:var(--chip); border:1px solid var(--line); border-radius:7px; width:28px; height:24px; padding:0; font-size:11px; line-height:1; cursor:pointer}
.pc .ic:hover{border-color:var(--accent)}
html[dir="rtl"] .pc .flip{transform:scaleX(-1)}
.pw{margin-top:4px; font-size:11px; color:#c0621c}
.pbtn{position:absolute; top:12px; inset-inline-end:12px; z-index:5; width:46px; height:46px; border-radius:50%; padding:0; border:2px solid #1f8a4c; background:var(--panel); cursor:pointer; box-shadow:0 3px 10px rgba(10,20,30,.2)}
.pbtn img{width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 30%}
.pbtn span{position:absolute; bottom:-3px; inset-inline-end:-3px; width:18px; height:18px; border-radius:50%; background:#1f8a4c; color:#fff; font-size:9px; display:grid; place-items:center}
.pbtn[hidden]{display:none}
.stage.tour .hint{display:none}
@media (max-width:820px){.presenter{top:8px; inset-inline-end:8px; width:min(270px,calc(100% - 16px))}.pbtn{top:8px}.stage.tour .ovl{display:none}}
.stage .hint{inset-inline-end:70px}
.wm{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;user-select:none;font:600 11px/1.2 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;opacity:.5;text-shadow:0 0 3px rgba(0,0,0,.85),0 0 1px #000;white-space:nowrap;letter-spacing:.2px}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="ph">
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <button class="lang" data-lang-toggle>English</button>
    </header>
    <section class="card" id="card" aria-live="polite"></section>
    <section class="mix">
      <h3 data-t="opMode"></h3>
      <div class="seg pkseg" role="group">
        <button data-op="pid" aria-pressed="true"></button>
        <button data-op="man" aria-pressed="false"></button>
      </div>
      <h3 data-t="opCv" style="margin-top:10px"></h3>
      <div class="seg pkseg" role="group">
        <button data-cv="0" aria-pressed="false">T1</button>
        <button data-cv="1" aria-pressed="true">T2</button>
        <button data-cv="2" aria-pressed="false">T3</button>
      </div>
      <h3 data-t="opSp" style="margin-top:10px"></h3>
      <div class="seg pkseg" role="group">
        <button data-sp="30" aria-pressed="true">30</button><button data-sp="40" aria-pressed="false">40</button><button data-sp="60" aria-pressed="false">60</button><button data-sp="80" aria-pressed="false">80</button><button data-sp="90" aria-pressed="false">90</button>
      </div>
      <h3 data-t="opFan" style="margin-top:10px"></h3>
      <div class="seg pkseg" role="group">
        <button data-fan="0" aria-pressed="true"></button>
        <button data-fan="1" aria-pressed="false"></button>
      </div>
      <h3 data-t="opType" style="margin-top:12px"></h3>
      <div class="seg pkseg" role="group">
        <button data-ctype="P" aria-pressed="true">P</button><button data-ctype="PI" aria-pressed="false">PI</button><button data-ctype="PID" aria-pressed="false">PID</button>
      </div>
      <h3 data-t="opPG" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="pg" min="1" max="150" step="0.5" value="20" aria-label="PG"><output id="pgOut">–</output></div>
      <h3 data-t="opTi" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="ti" min="20" max="900" step="5" value="200" aria-label="Integral time"><output id="tiOut">–</output></div>
      <h3 data-t="opTd" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="td" min="0" max="200" step="1" value="40" aria-label="Derivative time"><output id="tdOut">–</output></div>
      <h3 data-t="opMan" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="mu" min="-100" max="100" step="1" value="20" aria-label="Manual output"><output id="muOut">–</output></div>
      <h3 data-t="opHy" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="hy" min="0" max="0.1" step="0.0005" value="0.0005" aria-label="Relay hysteresis"><output id="hyOut">–</output></div>
      <h3 data-t="opSpd" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="sd" min="0.5" max="2.5" step="0.05" value="1.5" aria-label="Simulation speed"><output id="sdOut">–</output></div>
      <dl class="readout">
        <dt data-t="dSig"></dt><dd id="oSig">–</dd>
        <dt data-t="dMod"></dt><dd id="oMod">–</dd>
        <dt data-t="dMet"></dt><dd id="oMet">–</dd>
        <dt data-t="dGn"></dt><dd id="oGn">–</dd>
        <dt data-t="dKu"></dt><dd id="oKu">–</dd>
        <dt data-t="dZn"></dt><dd id="oZn">–</dd>
        <dt data-t="dMg"></dt><dd id="oMg">–</dd>
        <dt data-t="dPrt"></dt><dd id="oPrt">–</dd>

 prt:{ar:'The three PRT sensors',en:'المجسات الثلاثة PRT',d:'Platinum PT100 sensors at different distances from the hot end, so each reads a different temperature. The farther the sensor, the larger the lag (an apparent dead time) and the smaller the gain, so T3 is harder to control than T1. The sensor resistance is R = 100(1 + 3.9083×10⁻³t − 5.775×10⁻⁷t²) by IEC 60751, and its class B error is up to ±(0.30 + 0.005|t|)°C.',n:'R = R₀(1 + A·t + B·t²)'},

  fine:'محاكاة للتجربة 6 (السيطرة على الحرارة بوحدة PCT-M4) بحسب دليل مختبر السيطرة على العمليات (الجامعة التكنولوجية، إعداد سناء وثيق ونسمة بلاسم، إشراف د. زيدون محسن)، مع تحليل من كتاب المحاضرات (د. زيدون محسن شكور): تقريب الزمن الميت (المحاضرة 6)، والمتحكمات (9)، ومعيار الاستقرار (12)، والاستجابة الترددية (13). المراجع التي تحققتُ منها: [1] Bytronic Ltd.: ورقة منتج «Process Control Technology Temperature Module PCT-M4»: ساق تُسخَّن بعنصر ثرموكهربائي داخل أنبوب مغلق من PTFE، وثلاثة مجسات PRT موزعة على الساق، ومروحة عند طرف الأنبوب تعطي الاضطراب وتُشغَّل يدوياً، والمدى 0–100°C. [2] IEC 60751: R = R₀(1 + A·t + B·t²) مع A = 3.9083×10⁻³ وB = −5.775×10⁻⁷ للمجس PT100 عند t ≥ 0، وفئتا الدقة A (±(0.15 + 0.002|t|)) وB (±(0.30 + 0.005|t|)). [3] معادلات وحدة بلتييه أحادية البعد بثوابت: Q_c = αIT_c − ½I²R − KΔT وQ_h = Q_c + VI مع V = αΔT + IR (كما في Ferrotec Thermoelectric Technical Reference §11 وفي مراجعة THERMINIC 2007، arXiv:0801.1037)؛ وثوابت الوحدة من بيانات الصحيفة اشتققتُها: α = V_max/T_h وR = (T_c/T_h)(V_max/I_max) وK = V_max·I_max·T_c/(2T_h·ΔT_max). [4] معادلة الزعنفة: Incropera وآخرون، Fundamentals of Heat and Mass Transfer، جدول 3.4 الحالة B (طرف معزول). [5] Ziegler وNichols (1942)، Trans. ASME 64، 759–768. [6] Åström وHägglund (1984)، Automatica 20(5)، 645–651، DOI 10.1016/0005-1098(84)90014-1: K_u = 4h/(π·a) والتصحيح بالتخلّف 4h/(π·√(a² − ε²)). ما لم أستطع التحقق منه ولذلك افترضته (وليس قياساً على الوحدة): مادة الساق (ألومنيوم k = 200) وقطرها 10 mm وطولها 20 cm، ومواضع المجسات (3 و10 و17 cm من الطرف)، ومعاملا الحمل (8 W/m²K بلا مروحة و35 معها)، ومقاومة المشتت (2 و0.8 K/W)، وبيانات وحدة بلتييه (ΔT_max = 80 K وI_max = 4 A وV_max = 15 V عند 300 K، أي α = 0.05 V/K وR = 2.75 Ω وK = 0.275 W/K)، وتأخر المجس 6 s وضجيج 0.02°C وإزاحة ثابتة لكل مجس داخل حدّ الفئة B، وتعريف PG بأنه الكسب K_p = PG (% خرج لكل % من مدى 0–100°C)، وأن التحكم يسخّن فقط. التحقق: المحاكاة العددية تطابق معادلة الزعنفة (0.001°C بلا مروحة، 0.013°C مع المروحة)، والدالة التحويلية الخطية الدقيقة (بدوال هذلولية، مع وحدة بلتييه والمشتت) تطابق محاكاة جيبية صغيرة: المقدار 0.1316 مقابل 0.1316 والطور −126.0° مقابل −125.9°، وميزان الطاقة لوحدة بلتييه يُغلق (10.32 W). والكسب الحدّي عند 40°C (المجس 2، بلا مروحة): الدالة الدقيقة 57.6 والمحاكاة بخطوة صغيرة 56.5 (−2%) والمرحّل 53.7 (−7%، خطأ تقريب الدالة الوصفية)، لكن تخلّفاً 0.05°C في المرحّل يخفضه إلى 33 فيجب جعل ε أصغر من سعة التذبذب بكثير. وتتغير الخصائص مع الوضع: Ku للمجس 3 (17) أقل بنحو تسعة أضعاف من المجس 1 (153) بسبب التأخر، وربح الساق عند 90°C (3.28 °C/%) أكبر 4.5 مرة منه عند 30°C (0.73) بسبب التوصيل K·ΔT. ولضبط زيغلر–نيكولز تجاوز كبير هنا (PI: 140% وPID: 85%)، فهو ضبط عدواني يحتاج تخفيضاً.',

  pick:'<h2>كيف تتحكم الوحدة في حرارة الساق؟</h2><p>يضخ عنصر بلتييه الحرارة إلى طرف الساق بحسب التيار، فتنتشر بالتوصيل وتضيع بالحمل. يقيس مجسّ PT100 الحرارة على بعد معيّن فتتأخر القراءة عن الخرج، وكلما بعد المجس زاد التأخر.</p><p>غيّر القيمة المطلوبة لترى الربح يتضاعف، وشغّل المروحة اضطراباً، وجرّب P ثم PI. وابحث عن الكسب الحدّي بالمرحّل.</p>',

  fine:'A simulation of experiment 6 (temperature control with the PCT-M4 unit) according to the Process Control Laboratory manual (University of Technology, prepared by Sana Wathiq and Nesma Balasim, supervised by Dr. Zaidoon Mohsin), with analysis from the lecture book (Dr. Zaidoon M. Shakoor): dead-time approximation (lecture 6), controllers (9), the stability criterion (12) and frequency response (13). References I verified: [1] Bytronic Ltd., product sheet “Process Control Technology Temperature Module PCT-M4”: a rod heated by a thermoelectric element inside an enclosed PTFE tube, three PRT sensors along the rod, a fan at the end of the tube that gives the disturbance and is switched on manually, range 0–100°C. [2] IEC 60751: R = R₀(1 + A·t + B·t²) with A = 3.9083×10⁻³ and B = −5.775×10⁻⁷ for the PT100 at t ≥ 0, and the accuracy classes A (±(0.15 + 0.002|t|)) and B (±(0.30 + 0.005|t|)). [3] The one-dimensional constant-parameter thermoelectric module equations: Q_c = αIT_c − ½I²R − KΔT and Q_h = Q_c + VI with V = αΔT + IR (as in the Ferrotec Thermoelectric Technical Reference §11 and in the THERMINIC 2007 review, arXiv:0801.1037); and the module constants from datasheet values, which I derived: α = V_max/T_h, R = (T_c/T_h)(V_max/I_max) and K = V_max·I_max·T_c/(2T_h·ΔT_max). [4] The fin equation: Incropera et al., Fundamentals of Heat and Mass Transfer, Table 3.4 case B (insulated tip). [5] Ziegler and Nichols (1942), Trans. ASME 64, 759–768. [6] Åström and Hägglund (1984), Automatica 20(5), 645–651, DOI 10.1016/0005-1098(84)90014-1: K_u = 4h/(π·a) and the hysteresis correction 4h/(π·√(a² − ε²)). What I could not verify and therefore assumed (not measured on the unit): the rod material (aluminium, k = 200), its diameter of 10 mm and length of 20 cm, the sensor positions (3, 10 and 17 cm from the hot end), the convection coefficients (8 W/m²K without the fan and 35 with it), the heat-sink resistance (2 and 0.8 K/W), the module data (ΔT_max = 80 K, I_max = 4 A and V_max = 15 V at 300 K, i.e. α = 0.05 V/K, R = 2.75 Ω and K = 0.275 W/K), a sensor lag of 6 s, noise of 0.02°C and a fixed offset per sensor inside the class B limit, the definition of PG as the gain K_p = PG (% output per % of the 0–100°C range), and that the control only heats. Verification: the numerical simulation matches the fin equation (0.001°C without the fan, 0.013°C with it), the exact linear transfer function (hyperbolic functions, with the Peltier module and the heat sink) matches a small sinusoidal simulation: gain 0.1316 against 0.1316 and phase −126.0° against −125.9°, and the module energy balance closes (10.32 W). The ultimate gain at 40°C (sensor 2, fan off): the exact function 57.6, the small-step simulation 56.5 (−2%), the relay 53.7 (−7%, the describing-function approximation error), but a relay hysteresis of 0.05°C lowers it to 33, so ε must be much smaller than the oscillation amplitude. The properties change with the condition: Ku for sensor 3 (17) is about nine times lower than for sensor 1 (153) because of the lag, and the rod gain at 90°C (3.28 °C/%) is 4.5 times that at 30°C (0.73) because of the K·ΔT conduction. And the Ziegler–Nichols settings overshoot a lot here (PI: 140%, PID: 85%): they are aggressive and need detuning.',

 if(fly){fly.e+=dt;const u=ease(Math.min(1,fly.e/fly.d));camera.position.lerpVectors(fly.p0,fly.p1,u);controls.target.lerpVectors(fly.t0,fly.t1,u);if(fly.e>=fly.d)fly=null;}

 /* the rod coloured by temperature, the module glow, the fan and the air */
 for(let i=0;i<20;i++){const Tv=.5*(PL.T[i]+PL.T[i+1]);SEGM[i].material.color.copy(tcol(Tv,_c));}
 PELT.material.emissiveIntensity=Math.min(1.5,Math.abs(PL.I)/PM.Imax*1.6);PELT.material.emissive.set(PL.I<0?0x2979ff:0xff3d00).convertSRGBToLinear();
 if(FAN&&running)fanA+=dt*18;FANR.rotation.x=fanA;
 for(let i=0;i<NPA;i++){const d=airD[i];if(!FAN){AIR.pos[i*3+1]=-50;continue;}if(running)d.s=(d.s+dt*d.v*2.2)%6.8;AIR.pos[i*3]=1.3+d.s;AIR.pos[i*3+1]=YT+d.r*Math.sin(d.a);AIR.pos[i*3+2]=ZP+d.r*Math.cos(d.a);}
 AIR.g.attributes.position.needsUpdate=true;AIR.g.attributes.color.needsUpdate=true;
 rt+=dt;if(rt>.3){rt=0;readouts(false);}

 const cw=canvas.clientWidth,ch=canvas.clientHeight;

  if(show){tmp.copy(pt.anchor);tmp.project(camera);if(tmp.z>1||tmp.z<-1)show=false;}

 requestAnimationFrame(frame);}

(function(){
const CFG={btn:"bRun",isOn:()=>running,tour:[[null, "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ. أَنا المُهَنْدِسُ عَلاءُ مُحَمَّد، مِنْ قِسْمِ الهَنْدَسَةِ الكيمْياوِيَّةِ في جامِعَةِ البَصْرَة. أَهْلاً بِكُمْ في هذا المُحاكي ثُلاثِيِّ الأَبْعادِ لِوَحْدَةِ السَّيْطَرَةِ عَلى الحَرارَةِ بي سي تي إِمْ أَرْبَعَة. سَأُعَرِّفُكُمْ عَلى أَجْزائِهِ الرَّئيسَة، ثُمَّ نُشاهِدُ مَعاً كَيْفَ يَضُخُّ عُنْصُرُ بَلْتْيِيه الحَرارَةَ إِلى ساقٍ، وَلِماذا يَتَغَيَّرُ رِبْحُ العَمَلِيَّةِ مَعَ دَرَجَةِ الحَرارَة.", "Hello and welcome. I am Engineer Alaa Mohammed from the Department of Chemical Engineering at the University of Basrah. Welcome to this three-dimensional simulator of the PCT-M4 temperature control unit. I will introduce its main parts, and then we will watch together how a Peltier element pumps heat into a rod, and why the process gain changes with the temperature."], ["peltier", "هذا عُنْصُرُ بَلْتْيِيه. بِالتَّيّارِ يَضُخُّ الحَرارَةَ إِلى طَرَفِ الساق، لكِنَّ جُزْءاً مِنْها يَعودُ بِالتَّوْصيلِ إِلى الجانِبِ البارِد، فَيَقِلُّ الرِّبْحُ كُلَّما ارْتَفَعَتِ الحَرارَة. وَالمِرْوَحَةُ هِيَ الاضْطِراب.", "This is the Peltier element. With the current it pumps heat into the end of the rod, but part of it returns by conduction to the cold side, so the gain falls as the temperature rises. The fan is the disturbance."], ["rod", "وَالساقُ مِنَ الأَلومِنْيوم. تَنْتَشِرُ فيها الحَرارَةُ بِالتَّوْصيل، وَتَضيعُ جُزْئِيّاً بِالحَمْل. وَلَوْنُها يُبَيِّنُ الحَرارَةَ عَلى طولِها.", "The rod is aluminium. The heat spreads in it by conduction and is partly lost by convection. Its colour shows the temperature along it."], ["prt", "وَهذِهِ المُجَسّاتُ الثَّلاثَة. كُلَّما بَعُدَ المِجَسُّ زادَ التَّأَخُّرُ وَقَلَّ الرِّبْح، فَالسَّيْطَرَةُ عَلى الثّالِثِ أَصْعَبُ بِكَثير.", "These are the three sensors. The farther the sensor, the greater the lag and the smaller the gain, so controlling the third is much harder."], ["unit", "وَهذِهِ وَحْدَةُ التَّحَكُّم. تُحَوِّلُ أَوامِرَ البَرْنامَجِ إِلى تَيّارٍ لِبَلْتْيِيه، وَتَقْرَأُ المُجَسّاتِ، وَتُشَغِّلُ المِرْوَحَة.", "This is the control unit. It turns the software commands into the Peltier current, reads the sensors and switches the fan."], ["pc", "وَفي الشَّريطِ الجانِبِيِّ جَدْوَلا الدَّليلِ مَمْلوءَيْنِ تِلْقائِيّاً، وَمُخَطَّطُ بودي، وَتَجْرِبَةُ المُرَحِّلِ لإيجادِ الكَسْبِ الحَدِّيّ.", "The side panel holds the manual’s two tables filled in automatically, the Bode diagram, and the relay test for finding the ultimate gain."], [null, "جَرِّبوا الآنَ: غَيِّروا القيمَةَ المَطْلوبَةَ مِنْ ثَلاثينَ إِلى تِسْعينَ وَلاحِظوا اخْتِلافَ الرِّبْح. شَغِّلوا المِرْوَحَةَ اضْطِراباً. ثُمَّ جَرِّبوا التَّحَكُّمَ في المِجَسِّ الثّالِثِ بَدَلَ الأَوَّل، وَقارِنوا الكَسْبَ الحَدِّيَّ بِالمُرَحِّل. بِالتَّوْفيقِ لِلْجَميع.", "Now try it yourselves: change the set point from thirty to ninety and watch the gain change. Switch the fan on as a disturbance. Then control the third sensor instead of the first, and compare the ultimate gain with the relay. Good luck to you all."]]};

while(wrap.firstChild)stage.appendChild(wrap.firstChild);
const presenter=document.getElementById('presenter'),pText=document.getElementById('pText'),pStep=document.getElementById('pStep'),pPlay=document.getElementById('pPlay'),pOpen=document.getElementById('pOpen'),pWarn=document.getElementById('pWarn');
pOpen.querySelector('img').src=presenter.querySelector('.pv img').src;
let tIdx=-1,tPaused=false,tTimer=null,tToken=0,arVoice=null,enVoice=null,arMale=false;
const synth=window.speechSynthesis||null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();
 const ar=v.filter(x=>/^ar/i.test(x.lang)),ML=/hamed|naayf|shakir|bassel|fahed|taim|rami|moaz|hamdan|\bali\b|saleh|laith|hedi|ismael|jamal|omar|abdullah|maged|majed|tarik|\bmale\b/i,FL=/zariyah|salma|hoda|rana|noura|sana|layla|laila|amal|hala|fatima|maryam|amany|amina|iman|mouna|reem|aysha|\bfemale\b/i,sa=x=>(ML.test(x.name)?100:0)-(FL.test(x.name)?100:0)+(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?2:0)+(/ar[-_]SA/i.test(x.lang)?1:0);arVoice=ar.sort((a,b)=>sa(b)-sa(a))[0]||null;arMale=!!(arVoice&&ML.test(arVoice.name)&&!FL.test(arVoice.name));
 const en=v.filter(x=>/^en/i.test(x.lang)),se=x=>(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?4:0)+(/ryan|guy|george|daniel|david|arthur|male/i.test(x.name)?3:0)+(/en[-_]GB/i.test(x.lang)?2:0);
 enVoice=en.sort((a,b)=>se(b)-se(a))[0]||null;}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
function chunks(t){return t.split(/(?<=[.،,:;!?؟])\s+/).reduce((a,s)=>{if(a.length&&(a[a.length-1]+' '+s).length<170)a[a.length-1]+=' '+s;else a.push(s);return a;},[]);}
function speak(text,done){const tok=++tToken;presenter.classList.add('talking');const fin=()=>{if(tok!==tToken)return;presenter.classList.remove('talking');done();};
 const vv=lang==='ar'?arVoice:enVoice;
 if(synth&&vv){synth.cancel();if(lang==='ar'&&!arMale){pWarn.hidden=false;pWarn.textContent=PU().noMale;}const parts=chunks(text);let i=0;
  const next=()=>{if(tok!==tToken)return;if(i>=parts.length){fin();return;}const u=new SpeechSynthesisUtterance(parts[i++]);u.voice=vv;u.lang=vv.lang;u.rate=lang==='ar'&&!arMale?.95:1;u.pitch=lang==='ar'&&!arMale?.72:1;
   u.onend=()=>setTimeout(next,120);u.onerror=()=>setTimeout(next,120);synth.speak(u);};next();}
 else{pWarn.hidden=false;pWarn.textContent=PU().noVoice;tTimer=setTimeout(fin,Math.max(5000,text.split(/\s+/).length*420));}}

 pText.textContent=lang==='ar'?strip(ar):en;pText.dir=lang==='ar'?'rtl':'ltr';pText.lang=lang;pStep.textContent='('+(i+1)+' / '+CFG.tour.length+')';pText.scrollTop=0;
