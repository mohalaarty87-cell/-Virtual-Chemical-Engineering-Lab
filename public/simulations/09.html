<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكي خزان الوميض | Flash Drum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4eaee; --stage-a:#f3f6f8; --stage-b:#d2dce2; --panel:#f7f9fa; --ink:#1b2830; --muted:#5a6a75;
  --line:#c9d4db; --chip:#ffffff; --accent:#b85f1e; --accent-ink:#ffffff; --cool:#2f76b3; --tint:#edf2f5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;
    --line:#2c3a44; --chip:#21303a; --accent:#e0873d; --accent-ink:#1a1108; --cool:#5d9fd5; --tint:#1e2a32;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;
  --line:#2c3a44; --chip:#21303a; --accent:#e0873d; --accent-ink:#1a1108; --cool:#5d9fd5; --tint:#1e2a32;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif; font-size:15px; line-height:1.7}
button{font:inherit; color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{display:grid; grid-template-columns:minmax(300px,370px) 1fr; height:100%}
.panel{background:var(--panel); border-inline-end:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column}
.ph{padding:22px 22px 14px}
.ph h1{margin:0; font-size:21px; line-height:1.4; font-weight:700}
.ph .sub{margin:2px 0 0; color:var(--muted); font-size:13.5px; direction:ltr; text-align:right}

.card{margin:0 16px; padding:16px 18px; background:var(--tint); border-radius:12px; border:1px solid var(--line)}
.card h2{margin:0; font-size:18px; font-weight:600; line-height:1.45}
.card .en{margin:0 0 8px; color:var(--muted); font-size:13px; direction:ltr; text-align:right}
.card p{margin:6px 0}
.card .eq{margin-top:10px; padding:8px 10px; border-inline-start:3px solid var(--accent); background:var(--panel); border-radius:0 6px 6px 0; font-size:14px; unicode-bidi:plaintext}
.card .head{display:flex; gap:10px; align-items:flex-start}
.card .head .num{flex:none; margin-top:3px}
.card .act{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
.card .act button{background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13.5px}
.card .act button:hover{border-color:var(--accent)}

.num{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; font-size:12.5px; font-weight:600;
  background:var(--chip); border:1.5px solid var(--ink); line-height:1; font-variant-numeric:tabular-nums}

.mix{padding:18px 22px 6px}
.mix h3,.parts h3{margin:0 0 6px; font-size:15px; font-weight:600}
.rpm{display:flex; align-items:center; gap:12px}
.rpm input{flex:1; accent-color:var(--accent)}
.rpm output{min-width:86px; font-weight:600; font-variant-numeric:tabular-nums}
.readout{display:grid; grid-template-columns:1fr auto; gap:2px 12px; margin:10px 0 4px; font-size:14px}
.readout dt{color:var(--muted)}
.readout dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums; direction:ltr; text-align:left}
.fine{font-size:12.5px; color:var(--muted); margin:6px 0 0}

.parts{padding:14px 14px 8px}
.parts h3{padding:10px 8px 2px; color:var(--muted); font-size:13px}
.parts ul{list-style:none; margin:0; padding:0}
.parts li button{display:flex; align-items:center; gap:10px; width:100%; text-align:right; background:none; border:0;
  padding:5px 8px; border-radius:8px; cursor:pointer; font-size:14.5px}
.parts li button:hover{background:var(--tint)}
.parts li button[aria-current="true"]{background:var(--tint); box-shadow:inset -3px 0 0 var(--accent)}
.parts li button[aria-current="true"] .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lang{display:inline-block; cursor:pointer; background:none; font:inherit; margin-top:8px; font-size:13.5px; color:var(--accent); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:2px 10px}
.lang:hover{border-color:var(--accent)}
.credit{margin-top:auto; padding:14px 22px 20px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line)}
.credit b{color:var(--ink); font-weight:600}

.stage{position:relative; overflow:hidden; background:radial-gradient(ellipse 70% 65% at 50% 42%, var(--stage-a), var(--stage-b))}
#c{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
#c:active{cursor:grabbing}
.labels{position:absolute; inset:0; pointer-events:none}
.lbl{direction:ltr; position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0; border:0; background:none; cursor:pointer; white-space:nowrap}
.lbl .t{direction:rtl; display:none; background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:12.5px; box-shadow:0 1px 3px rgba(20,30,40,.18)}
.labels.names .lbl .t,.lbl.on .t{display:inline-block}
.lbl .num{box-shadow:0 1px 3px rgba(20,30,40,.25)}
.lbl.on .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lbl.on .t{border-color:var(--accent)}
.labels.off .lbl:not(.on){display:none}

.ovl{position:absolute; top:14px; inset-inline-start:16px; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:8px}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-radius:10px; padding:5px 12px; font-size:13px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:11px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.legend b{font-weight:500}
.tb.rx{background:#1f8a4c; color:#fff; border-color:#1f8a4c; font-weight:600}
.tb.rx[aria-pressed="true"]{background:#b3362b; border-color:#b3362b; color:#fff}
.rxbar{display:flex; height:12px; border-radius:6px; overflow:hidden; margin:8px 0 4px; background:var(--line)}
.rxbar div{transition:width .25s linear}
.brand{ background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-inline-start:4px solid var(--accent); border-radius:10px; padding:8px 14px 9px}
.brand .who{font-size:17px; font-weight:700; line-height:1.4}
.brand .en{font-size:13px; color:var(--muted); direction:ltr; text-align:right}
.brand .org{font-size:12.5px; color:var(--muted)}
.hint{position:absolute; top:14px; inset-inline-end:16px; max-width:300px; font-size:13px; color:var(--muted); pointer-events:none}
.toolbar{position:absolute; bottom:14px; inset-inline:14px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; pointer-events:none}
.toolbar > *{pointer-events:auto}
.tb{background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:6px 13px; cursor:pointer; font-size:13.5px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.tb:hover{border-color:var(--accent)}
.tb[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.seg{display:inline-flex; background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:2px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.seg button{border:0; background:none; padding:4px 11px; border-radius:7px; cursor:pointer; font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:15px; padding:20px; text-align:center}

html[dir="ltr"] .ph .sub,html[dir="ltr"] .card .en,html[dir="ltr"] .brand .en{direction:rtl; text-align:left}
html[dir="ltr"] .readout dd{text-align:right}
html[dir="rtl"] #oReg{direction:rtl}
html[dir="ltr"] .parts li button{text-align:left}
html[dir="ltr"] .parts li button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
html[dir="ltr"] .lbl .t{direction:ltr}
html[dir="ltr"] .card .eq{border-radius:0 6px 6px 0}
html[dir="rtl"] .card .eq{border-radius:6px 0 0 6px}
@media (max-width:820px){
  html,body{height:auto}
  .app{grid-template-columns:1fr; height:auto}
  .stage{order:-1; height:66svh; min-height:380px}
  .panel{border-inline-end:0; overflow:visible}
  .hint{display:none}
  .ovl{top:10px; inset-inline-start:10px}
  .brand{padding:6px 10px}
  .legend{font-size:12px; padding:4px 9px}
  .brand .who{font-size:15px}
  .brand .org{display:none}
  .toolbar{bottom:10px; gap:6px}
  .tb,.seg button{font-size:12.5px}
}
.prof-h{margin-top:14px !important}
.prof{display:grid; grid-template-columns:auto 1fr auto; gap:3px 8px; align-items:center; font-size:12.5px; font-variant-numeric:tabular-nums}
.prof .k{color:var(--muted)}
.prof .tr{height:9px; background:var(--line); border-radius:5px; overflow:hidden}
.prof .tr div{height:100%; border-radius:5px; transition:width .3s}
.prof .v{direction:ltr}
.legend i.grad{width:34px; border-radius:6px; background:linear-gradient(90deg,#f2c21b,#e23b32)}
html[dir="rtl"] .legend i.grad{background:linear-gradient(270deg,#f2c21b,#e23b32)}
.legend i.bub{background:transparent; box-shadow:inset 0 0 0 2px #e9844a}
@media (max-width:820px){
  .stage{height:auto; min-height:0; display:flex; flex-direction:column}
  #c{height:60svh; min-height:340px; flex:none}
  .toolbar{position:static; inset:auto; padding:10px 10px 12px; background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .labels{bottom:auto; height:max(60svh,340px)}
}
.tb.fl{border-color:#b3362b; color:#b3362b; font-weight:600}
.tb.fl[aria-pressed="true"]{background:#b3362b; color:#fff}
.fwarn{background:#b3362b; color:#fff; border-radius:10px; padding:6px 12px; font-size:13.5px; font-weight:600; max-width:340px; box-shadow:0 2px 8px rgba(120,20,10,.3)}
.fwarn[hidden]{display:none}
.card.fcard{border-color:#b3362b; border-inline-start:4px solid #b3362b}
.card.fcard h2{color:#b3362b}
.card ul{margin:6px 0; padding-inline-start:20px}
.card li{margin:2px 0}
.card h4{margin:10px 0 2px; font-size:14.5px}
#chart svg{width:100%; height:auto; display:block}
#chart text{font-size:10px; fill:var(--muted); font-family:inherit}
.ch-leg{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--muted); margin-top:4px}
.ch-leg i{display:inline-block; width:16px; height:3px; border-radius:2px; vertical-align:middle; margin-inline-end:5px}
.fwarn.ok{background:#1f8a4c}
.legend i.sw{width:34px; border-radius:6px; background:linear-gradient(90deg,#ff3b1f,#1f5fff)}
.legend i.gw{width:34px; border-radius:6px; background:linear-gradient(90deg,#9be38a,#f4f4f4)}
html[dir="rtl"] .legend i.sw{background:linear-gradient(270deg,#ff3b1f,#1f5fff)}
html[dir="rtl"] .legend i.gw{background:linear-gradient(270deg,#9be38a,#f4f4f4)}
.pkseg{display:flex; width:100%}
.pkseg button{flex:1; padding:6px 3px; font-size:12.5px}
#chart2 svg{width:100%;height:auto;display:block;margin-top:8px}#chart2 text{font-size:10px;fill:var(--muted);font-family:inherit}
#chart svg,#chart2 svg,#chart3 svg{width:100%;height:auto;display:block;margin-top:8px}#chart text,#chart2 text,#chart3 text{font-size:10px;fill:var(--muted);font-family:inherit}
.fwarn.bad{background:#c8352e}
.presenter{position:absolute; top:12px; inset-inline-end:12px; width:min(290px,calc(100% - 24px)); display:flex; gap:9px; align-items:flex-start; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:8px 9px; box-shadow:0 4px 16px rgba(10,20,30,.2); z-index:5}
.presenter[hidden]{display:none}
.pv{position:relative; flex:none; width:52px; height:52px}
.pv img{width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:50% 30%; position:relative; z-index:1; border:2px solid var(--panel)}
.pv .ring{position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(#1f8a4c,#1f78c8,#1f8a4c); opacity:.35}
.presenter.talking .pv img{animation:talk 2.4s ease-in-out infinite}
.presenter.talking .pv .ring{opacity:1; animation:spin 3s linear infinite}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-1px) scale(1.02) rotate(-.6deg)}50%{transform:translateY(0) scale(1.005)}75%{transform:translateY(-1px) scale(1.015) rotate(.6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pv .bars{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:2; background:var(--panel); border-radius:6px; padding:2px 4px; border:1px solid var(--line)}
.pv .bars i{display:block; width:2px; height:4px; background:#1f8a4c; border-radius:2px}
.presenter.talking .bars i{animation:bar .9s ease-in-out infinite}
.presenter.talking .bars i:nth-child(2){animation-delay:.15s}.presenter.talking .bars i:nth-child(3){animation-delay:.3s}.presenter.talking .bars i:nth-child(4){animation-delay:.45s}.presenter.talking .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:3px}50%{height:10px}}
.pb{flex:1; min-width:0}
.pn{font-weight:700; font-size:12.5px; line-height:1.3}
.pn span{font-weight:500; color:var(--muted); font-size:11.5px; margin-inline-start:4px}
.pt{font-size:12.5px; line-height:1.6; margin:3px 0 5px; max-height:4.9em; overflow-y:auto}
.pc{display:flex; gap:4px}
.pc .ic{background:var(--chip); border:1px solid var(--line); border-radius:7px; width:28px; height:24px; padding:0; font-size:11px; line-height:1; cursor:pointer}
.pc .ic:hover{border-color:var(--accent)}
html[dir="rtl"] .pc .flip{transform:scaleX(-1)}
.pw{margin-top:4px; font-size:11px; color:#c0621c}
.pbtn{position:absolute; top:12px; inset-inline-end:12px; z-index:5; width:46px; height:46px; border-radius:50%; padding:0; border:2px solid #1f8a4c; background:var(--panel); cursor:pointer; box-shadow:0 3px 10px rgba(10,20,30,.2)}
.pbtn img{width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 30%}
.pbtn span{position:absolute; bottom:-3px; inset-inline-end:-3px; width:18px; height:18px; border-radius:50%; background:#1f8a4c; color:#fff; font-size:9px; display:grid; place-items:center}
.pbtn[hidden]{display:none}
.stage.tour .hint{display:none}
@media (max-width:820px){.presenter{top:8px; inset-inline-end:8px; width:min(270px,calc(100% - 16px))}.pbtn{top:8px}.stage.tour .ovl{display:none}}
.stage .hint{inset-inline-end:70px}
.wm{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;user-select:none;font:600 11px/1.2 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;opacity:.5;text-shadow:0 0 3px rgba(0,0,0,.85),0 0 1px #000;white-space:nowrap;letter-spacing:.2px}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="ph">
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <button class="lang" data-lang-toggle>English</button>
    </header>
    <section class="card" id="card" aria-live="polite"></section>
    <section class="mix">
      <h3 data-t="opMix"></h3>
      <div class="seg pkseg" role="group">
        <button data-mix="0" aria-pressed="true"></button>
        <button data-mix="1" aria-pressed="false"></button>
      </div>
      <h3 data-t="opMode" style="margin-top:12px"></h3>
      <div class="seg pkseg" role="group">
        <button data-mode2="adi" aria-pressed="true"></button>
        <button data-mode2="iso" aria-pressed="false"></button>
      </div>
      <h3 data-t="opF" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="ff" min="5" max="150" step="1" value="40" aria-label="Feed rate"><output id="ffOut">–</output></div>
      <h3 data-t="opT" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="tf" min="20" max="160" step="1" value="100" aria-label="Feed temperature"><output id="tfOut">–</output></div>
      <h3 data-t="opP" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="pp" min="1" max="4" step="0.05" value="1.5" aria-label="Drum pressure"><output id="ppOut">–</output></div>
      <h3 data-t="opZ1" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="z1" min="0" max="100" step="1" value="35" aria-label="Light component"><output id="z1Out">–</output></div>
      <h3 data-t="opZ2" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="z2" min="0" max="100" step="1" value="35" aria-label="Middle component"><output id="z2Out">–</output></div>
      <h3 data-t="opH" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="hs" min="0.15" max="0.40" step="0.01" value="0.25" aria-label="Level set point"><output id="hsOut">–</output></div>
      <dl class="readout">
        <dt data-t="dT"></dt><dd id="oT">–</dd>
        <dt data-t="dB"></dt><dd id="oB">–</dd>
        <dt data-t="dY"></dt><dd id="oY">–</dd>
        <dt data-t="dX"></dt><dd id="oX">–</dd>
        <dt data-t="dQ"></dt><dd id="oQ">–</dd>
        <dt data-t="dHy"></dt><dd id="oHy">–</dd>
        <dt data-t="dLv"></dt><dd id="oLv">–</dd>
        <dt data-t="dDn"></dt><dd id="oDn">–</dd>
        <dt data-t="dBd"></dt><dd id="oBd">–</dd>
        <dt data-t="dCl"></dt><dd id="oCl">–</dd>
      </dl>
      <h3 class="prof-h" data-t="chH"></h3>
      <div id="chart"></div>
      <div id="chart2"></div>
      <div id="chart3"></div>
      <p class="fine" data-t="fine"></p>
    </section>
    <footer class="credit" data-t="credit"></footer>
  </aside>
  <main class="stage" id="stage">
    <canvas id="c" aria-label="3D flash drum"></canvas>
<div class="wm" aria-hidden="true">© 2026 المهندس علاء محمد · Engineer Alaa Mohammed</div>
    <div class="labels" id="labels"></div>
    <div class="ovl">
      <div class="brand"><div class="who" data-t="who"></div><div class="en" data-t="whoAlt"></div><div class="org" data-t="org"></div></div>
      <div class="fwarn" id="fwarn" hidden></div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:#2979ff"></i><b data-t="lgL"></b></span>
        <span><i style="background:#ff9100"></i><b data-t="lgV"></b></span>
        <span><i style="background:#d500f9"></i><b data-t="lgM"></b></span>
        <span><i style="background:#00c853"></i><b data-t="lgF"></b></span>
      </div>
    </div>
    <div class="hint" data-t="hint"></div>
    <div class="toolbar">
      <button class="tb rx" id="bRun" aria-pressed="false"></button>
      <button class="tb" id="bFault"></button>
      <button class="tb" id="bReset"></button>

(function(){
const CFG={btn:"bRun",isOn:()=>running,tour:[[null, "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ. أَنا المُهَنْدِسُ عَلاءُ مُحَمَّد، مِنْ قِسْمِ هَنْدَسَةِ المَوادِ في جامِعَةِ البَصْرَة. أَهْلاً بِكُمْ في هذا المُحاكي ثُلاثِيِّ الأَبْعادِ لِخَزّانِ الوَميض. سَأُعَرِّفُكُمْ عَلى أَجْزائِهِ الرَّئيسَة، ثُمَّ نُشاهِدُ مَعاً كَيْفَ يَفْصِلُ التَّبَخُّرُ المُفاجِئُ الخَليطَ إِلى بُخارٍ وَسائِل.", "Hello and welcome. I am Engineer Alaa Mohammed from the Department of Materials Engineering at the University of Basrah. Welcome to this three-dimensional simulator of the flash drum. I will introduce its main parts, and then we will watch together how sudden vaporisation separates a mixture into vapour and liquid."], ["feed", "يَضُخُّ هذا الخَزّانُ خَليطاً سائِلاً مِنْ ثَلاثَةِ مُكَوِّنات، بِمُعَدَّلٍ ثابِتٍ وَتَرْكيبٍ مَعْلوم، إِلى السَّخّان.", "This tank pumps a liquid mixture of three components, at a constant rate and a known composition, to the heater."], ["heater", "يُسَخِّنُ البُخارُ المُشْبَعُ التَّغْذِيَةَ هُنا. يَبْقى الضَّغْطُ أَعْلى مِنْ ضَغْطِ الفُقّاعَةِ فَلا يَتَبَخَّرُ الخَليطُ قَبْلَ الصِّمام.", "Saturated steam heats the feed here. The pressure stays above the bubble pressure, so the mixture does not vaporise before the valve."], ["valve", "هُنا يَهْبِطُ الضَّغْطُ فَجْأَة، فَيَتَبَخَّرُ جُزْءٌ مِنَ السّائِل. يَأْخُذُ البُخارُ حَرارَتَهُ الكامِنَةَ مِنَ السّائِلِ نَفْسِهِ فَتَنْخَفِضُ حَرارَةُ الباقي. هذا هُوَ الوَميضُ الأَديابَاتِيّ.", "Here the pressure drops suddenly, so part of the liquid vaporises. The vapour takes its latent heat from the liquid itself, so the rest cools. This is adiabatic flashing."], ["drum", "في الدَّرْمِ يَصْعَدُ البُخارُ وَيَهْبِطُ السّائِل، وَهُما في اتِّزان. فَالبُخارُ أَغْنى بِالمُكَوِّنِ الأَخَف، وَالسّائِلُ أَغْنى بِالأَثْقَل. تَنْظُرونَ إِلى الأَعْمِدَةِ في الشّاشَةِ لِتَرَوْا ذلِك.", "In the drum the vapour rises and the liquid falls, and they are in equilibrium. So the vapour is richer in the lightest component, and the liquid in the heaviest. Look at the bars on the screen to see this."], ["demister", "وَهذا مُزيلُ الرَّذاذ، يَلْتَقِطُ القَطَراتِ الصَّغيرَةَ الَّتي يَحْمِلُها البُخار. إِذا زادَتْ سُرْعَةُ البُخارِ عَلى الحَدِّ غَمَرَها وَانْجَرَفَ السّائِلُ مَعَ البُخارِ إِلى الأَعْلى.", "This is the demister, which catches the small droplets carried by the vapour. If the vapour velocity exceeds the limit it floods and liquid is carried up with the vapour."], ["level", "وَتُظْهِرُ زُجاجَةُ المُسْتَوى ارْتِفاعَ السّائِل. يَتَحَكَّمُ مُرْسِلُ المُسْتَوى بِصِمامِ القاعِ لِيَبْقى المُسْتَوى عِنْدَ القيمَةِ المَضْبوطَة.", "The level gauge shows the height of the liquid. The level transmitter controls the bottoms valve to keep the level at the set value."], ["vapor", "يَخْرُجُ البُخارُ مِنَ الأَعْلى عَبْرَ صِمامِ ضَبْطِ الضَّغْط. وَعَلى القُبَّةِ صِمامُ أَمانٍ يَفْتَحُ عِنْدَ الضَّغْطِ الزّائِدِ وَيُصَرِّفُ إِلى المِشْعَل.", "The vapour leaves at the top through a pressure control valve. On the dome is a relief valve that opens on overpressure and discharges to the flare."], ["bottoms", "وَتَسْحَبُ هذِهِ المِضَخَّةُ السّائِلَ مِنَ القاعِ إِلى الخَزّان. جَرِّبوا تَعْطيلَ صِمامِ القاعِ لِتَرَوْا المُسْتَوى يَرْتَفِعُ حَتّى يَصِلَ إِلى المُزيل.", "This pump draws the liquid from the bottom to the tank. Try failing the bottoms valve to see the level rise until it reaches the demister."], ["panel", "وَتَعْرِضُ لَوْحَةُ التَّحَكُّمِ الحَرارَةَ وَنِسْبَةَ التَّبَخُّرِ وَسُرْعَةَ البُخارِ مُقارَنَةً بِالحَدِّ وَالمُسْتَوى.", "The control panel shows the temperature, the vaporisation fraction, the vapour velocity against the limit and the level."], [null, "جَرِّبوا الآنَ: ارْفَعوا حَرارَةَ التَّغْذِيَةِ أَوِ اخْفِضوا الضَّغْطَ لِتَرَوْا نِسْبَةَ التَّبَخُّرِ تَزْداد، ثُمَّ ارْفَعوا المُعَدَّلَ حَتّى يَفيضَ المُزيل. وَبَدِّلوا إِلى النَّمَطِ المُتَساوي الحَرارَةِ وَقارِنوا قُدْرَةَ السَّخّان. بِالتَّوْفيقِ لِلْجَميع.", "Now try it yourselves: raise the feed temperature or lower the pressure to see the vaporisation fraction increase, then raise the rate until the demister floods. And switch to the isothermal mode and compare the heater duty. Good luck to you all."]]};
const strip=t=>t.replace(/[\u064B-\u0652\u0670]/g,'');
const PUI={ar:{name:'المهندس علاء محمد',prev:'السابق',pause:'إيقاف مؤقت',resume:'متابعة',next:'التالي',close:'إغلاق',open:'شرح المهندس علاء محمد',noVoice:'لا يتوفر صوت عربي في الجهاز الآن. يحاول المحاكي استخدام صوت النظام؛ إذا لم تسمع صوتاً، ثبّت صوتاً عربياً من إعدادات الهاتف ثم أعد فتح المحاكي.',noMale:'لا يمكن تأكيد نوع الصوت العربي المتاح؛ استُخدم كما هو دون خفض النبرة. يمكنك اختيار صوت رجالي من إعدادات الجهاز.'},
 en:{name:'Engineer Alaa Mohammed',prev:'Previous',pause:'Pause',resume:'Resume',next:'Next',close:'Close',open:'Tour with Eng. Alaa Mohammed',noVoice:'No Arabic device voice is currently available. The simulator is trying the system default; if you hear nothing, install an Arabic voice in your device settings and reopen it.'}};
const PU=()=>PUI[lang];
const wrap=document.createElement('div');
wrap.innerHTML=`<div class="presenter" id="presenter" hidden><div class="pv"><div class="ring"></div><img src="profile.png" alt=""><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
 <div class="pb"><div class="pn">x <span id="pStep"></span></div><div class="pt" id="pText"></div>
 <div class="pc"><button id="pPrev" class="ic flip">⏮</button><button id="pPlay" class="ic">❚❚</button><button id="pNext" class="ic flip">⏭</button><button id="pClose" class="ic">✕</button></div><div class="pw" id="pWarn" hidden></div></div></div>
 <button class="pbtn" id="pOpen"><img alt=""><span>▶</span></button>`;
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
const presenter=document.getElementById('presenter'),pText=document.getElementById('pText'),pStep=document.getElementById('pStep'),pPlay=document.getElementById('pPlay'),pOpen=document.getElementById('pOpen'),pWarn=document.getElementById('pWarn');
pOpen.querySelector('img').src=presenter.querySelector('.pv img').src;
let tIdx=-1,tPaused=false,tTimer=null,tToken=0,arVoice=null,enVoice=null,arMaleHint=false;
const synth=window.speechSynthesis||null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();
 const ar=v.filter(x=>/^ar(?:[-_]|$)/i.test(x.lang)),ML=/hamed|naayf|shakir|bassel|fahed|taim|rami|moaz|hamdan|\bali\b|saleh|laith|hedi|ismael|jamal|omar|abdullah|maged|majed|tarik|\bmale\b/i,FL=/zariyah|salma|hoda|rana|noura|sana|layla|laila|amal|hala|fatima|maryam|amany|amina|iman|mouna|reem|aysha|\bfemale\b/i,sa=x=>(ML.test(x.name)?100:0)-(FL.test(x.name)?100:0)+(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?2:0)+(/ar[-_]SA/i.test(x.lang)?1:0);arVoice=ar.sort((a,b)=>sa(b)-sa(a))[0]||null;arMaleHint=!!(arVoice&&ML.test(arVoice.name)&&!FL.test(arVoice.name));
 const en=v.filter(x=>/^en(?:[-_]|$)/i.test(x.lang)),se=x=>(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?4:0)+(/ryan|guy|george|daniel|david|arthur|male/i.test(x.name)?3:0)+(/en[-_]GB/i.test(x.lang)?2:0);
 enVoice=en.sort((a,b)=>se(b)-se(a))[0]||null;}
if(synth){pickVoice();if(synth.addEventListener)synth.addEventListener('voiceschanged',pickVoice);else synth.onvoiceschanged=pickVoice;}
function chunks(t){return t.split(/(?<=[.،,:;!?؟])\s+/).reduce((a,s)=>{if(a.length&&(a[a.length-1]+' '+s).length<170)a[a.length-1]+=' '+s;else a.push(s);return a;},[]);}
function speak(text,done){const tok=++tToken;presenter.classList.add('talking');const fin=()=>{if(tok!==tToken)return;presenter.classList.remove('talking');done();};
 const parts=chunks(text);let i=0,voiceWait=0;
 const next=()=>{if(tok!==tToken)return;if(!synth){pWarn.hidden=false;pWarn.textContent=PU().noVoice;tTimer=setTimeout(fin,Math.max(5000,text.split(/\s+/).length*420));return;}
  pickVoice();const vv=lang==='ar'?arVoice:enVoice;
  if(!vv&&voiceWait++<20){pWarn.hidden=false;pWarn.textContent=lang==='ar'?'جارٍ تحميل الأصوات العربية من الجهاز…':'Loading device voices…';tTimer=setTimeout(next,500);return;}
  if(!vv){pWarn.hidden=false;pWarn.textContent=PU().noVoice;}
  else if(lang==='ar'&&!arMaleHint){pWarn.hidden=false;pWarn.textContent=PU().noMale;}
  else pWarn.hidden=true;
  if(i>=parts.length){fin();return;}synth.cancel();const part=parts[i++];
  const queuePart=voice=>{if(tok!==tToken)return;const u=new SpeechSynthesisUtterance(part);if(voice)u.voice=voice;u.lang=(voice&&voice.lang)||(lang==='ar'?'ar-SA':'en-US');u.rate=1;u.pitch=1;
   u.onend=()=>setTimeout(next,120);u.onerror=()=>{if(voice)queuePart(null);else setTimeout(next,120);};try{synth.speak(u);}catch(e){if(voice)queuePart(null);else setTimeout(next,120);}};
  queuePart(vv||null);};
 next();}
function showStep(i){clearTimeout(tTimer);if(synth)synth.cancel();pWarn.hidden=true;tIdx=i;const [k,ar,en]=CFG.tour[i],say=lang==='ar'?ar:en;
 pText.textContent=lang==='ar'?strip(ar):en;pText.dir=lang==='ar'?'rtl':'ltr';pText.lang=lang;pStep.textContent='('+(i+1)+' / '+CFG.tour.length+')';pText.scrollTop=0;
 if(k){if(selected!==k)select(k);focusPart(k);}else{if(selected)select(null);view('iso');}
 if(!tPaused)speak(say,()=>{if(tIdx<CFG.tour.length-1)tTimer=setTimeout(()=>showStep(tIdx+1),700);});}
function syncPresenter(){presenter.querySelector('.pn').firstChild.textContent=PU().name+' ';
 [['pPrev',PU().prev],['pNext',PU().next],['pClose',PU().close]].forEach(([id,t])=>{const b=document.getElementById(id);b.title=t;b.setAttribute('aria-label',t);});
 pPlay.textContent=tPaused?'▶':'❚❚';pPlay.title=tPaused?PU().resume:PU().pause;pPlay.setAttribute('aria-label',pPlay.title);pOpen.title=PU().open;pOpen.setAttribute('aria-label',PU().open);presenter.querySelector('.pv img').alt=PU().name;}
function startTour(){presenter.hidden=false;pOpen.hidden=true;stage.classList.add('tour');tPaused=false;syncPresenter();if(mode==='full'){mode='cut';applyMode();}showStep(0);}
function stopTour(){tToken++;clearTimeout(tTimer);if(synth)synth.cancel();presenter.classList.remove('talking');presenter.hidden=true;pOpen.hidden=false;stage.classList.remove('tour');}
document.getElementById('pNext').onclick=()=>{if(tIdx<CFG.tour.length-1)showStep(tIdx+1);};
document.getElementById('pPrev').onclick=()=>{if(tIdx>0)showStep(tIdx-1);};
document.getElementById('pClose').onclick=stopTour;pOpen.onclick=startTour;
pPlay.onclick=()=>{tPaused=!tPaused;syncPresenter();if(tPaused){tToken++;clearTimeout(tTimer);if(synth)synth.cancel();presenter.classList.remove('talking');}else showStep(tIdx);};
const runBtn=document.getElementById(CFG.btn),oldRun=runBtn.onclick;
runBtn.onclick=e=>{if(oldRun)oldRun.call(runBtn,e);if(CFG.isOn())startTour();else stopTour();};
const oldSetLang=setLang;setLang=function(l){oldSetLang(l);syncPresenter();if(!presenter.hidden&&tIdx>=0)showStep(tIdx);};
syncPresenter();
})();

loadingEl.remove();requestAnimationFrame(frame);
})();
