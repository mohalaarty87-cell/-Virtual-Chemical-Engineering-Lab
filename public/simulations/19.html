<title>محاكي جهاز RT 578 للسيطرة على العمليات | RT 578 Process Control Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4eaee; --stage-a:#f3f6f8; --stage-b:#d2dce2; --panel:#f7f9fa; --ink:#1b2830; --muted:#5a6a75;
  --line:#c9d4db; --chip:#ffffff; --accent:#b85f1e; --accent-ink:#ffffff; --cool:#2f76b3; --tint:#edf2f5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;
    --line:#2c3a44; --chip:#21303a; --accent:#e0873d; --accent-ink:#1a1108; --cool:#5d9fd5; --tint:#1e2a32;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;
  --line:#2c3a44; --chip:#21303a; --accent:#e0873d; --accent-ink:#1a1108; --cool:#5d9fd5; --tint:#1e2a32;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif; font-size:15px; line-height:1.7}
button{font:inherit; color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{display:grid; grid-template-columns:minmax(300px,370px) 1fr; height:100%}
.panel{background:var(--panel); border-inline-end:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column}
.ph{padding:22px 22px 14px}
.ph h1{margin:0; font-size:21px; line-height:1.4; font-weight:700}
.ph .sub{margin:2px 0 0; color:var(--muted); font-size:13.5px; direction:ltr; text-align:right}

.card{margin:0 16px; padding:16px 18px; background:var(--tint); border-radius:12px; border:1px solid var(--line)}
.card h2{margin:0; font-size:18px; font-weight:600; line-height:1.45}
.card .en{margin:0 0 8px; color:var(--muted); font-size:13px; direction:ltr; text-align:right}
.card p{margin:6px 0}
.card .eq{margin-top:10px; padding:8px 10px; border-inline-start:3px solid var(--accent); background:var(--panel); border-radius:0 6px 6px 0; font-size:14px; unicode-bidi:plaintext}
.card .head{display:flex; gap:10px; align-items:flex-start}
.card .head .num{flex:none; margin-top:3px}
.card .act{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
.card .act button{background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13.5px}
.card .act button:hover{border-color:var(--accent)}

.num{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; font-size:12.5px; font-weight:600;
  background:var(--chip); border:1.5px solid var(--ink); line-height:1; font-variant-numeric:tabular-nums}

.mix{padding:18px 22px 6px}
.mix h3,.parts h3{margin:0 0 6px; font-size:15px; font-weight:600}
.rpm{display:flex; align-items:center; gap:12px}
.rpm input{flex:1; accent-color:var(--accent)}
.rpm output{min-width:86px; font-weight:600; font-variant-numeric:tabular-nums}
.readout{display:grid; grid-template-columns:1fr auto; gap:2px 12px; margin:10px 0 4px; font-size:14px}
.readout dt{color:var(--muted)}
.readout dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums; direction:ltr; text-align:left}
.fine{font-size:12.5px; color:var(--muted); margin:6px 0 0}

.parts{padding:14px 14px 8px}
.parts h3{padding:10px 8px 2px; color:var(--muted); font-size:13px}
.parts ul{list-style:none; margin:0; padding:0}
.parts li button{display:flex; align-items:center; gap:10px; width:100%; text-align:right; background:none; border:0;
  padding:5px 8px; border-radius:8px; cursor:pointer; font-size:14.5px}
.parts li button:hover{background:var(--tint)}
.parts li button[aria-current="true"]{background:var(--tint); box-shadow:inset -3px 0 0 var(--accent)}
.parts li button[aria-current="true"] .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lang{display:inline-block; cursor:pointer; background:none; font:inherit; margin-top:8px; font-size:13.5px; color:var(--accent); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:2px 10px}
.lang:hover{border-color:var(--accent)}
.credit{margin-top:auto; padding:14px 22px 20px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line)}
.credit b{color:var(--ink); font-weight:600}

.stage{position:relative; overflow:hidden; background:radial-gradient(ellipse 70% 65% at 50% 42%, var(--stage-a), var(--stage-b))}
#c{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
#c:active{cursor:grabbing}
.labels{position:absolute; inset:0; pointer-events:none}
.lbl{direction:ltr; position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0; border:0; background:none; cursor:pointer; white-space:nowrap}
.lbl .t{direction:rtl; display:none; background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:12.5px; box-shadow:0 1px 3px rgba(20,30,40,.18)}
.labels.names .lbl .t,.lbl.on .t{display:inline-block}
.lbl .num{box-shadow:0 1px 3px rgba(20,30,40,.25)}
.lbl.on .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lbl.on .t{border-color:var(--accent)}
.labels.off .lbl:not(.on){display:none}

.ovl{position:absolute; top:14px; inset-inline-start:16px; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:8px}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-radius:10px; padding:5px 12px; font-size:13px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:11px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.legend b{font-weight:500}
.tb.rx{background:#1f8a4c; color:#fff; border-color:#1f8a4c; font-weight:600}
.tb.rx[aria-pressed="true"]{background:#b3362b; border-color:#b3362b; color:#fff}
.rxbar{display:flex; height:12px; border-radius:6px; overflow:hidden; margin:8px 0 4px; background:var(--line)}
.rxbar div{transition:width .25s linear}
.brand{ background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-inline-start:4px solid var(--accent); border-radius:10px; padding:8px 14px 9px}
.brand .who{font-size:17px; font-weight:700; line-height:1.4}
.brand .en{font-size:13px; color:var(--muted); direction:ltr; text-align:right}
.brand .org{font-size:12.5px; color:var(--muted)}
.hint{position:absolute; top:14px; inset-inline-end:16px; max-width:300px; font-size:13px; color:var(--muted); pointer-events:none}
.toolbar{position:absolute; bottom:14px; inset-inline:14px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; pointer-events:none}
.toolbar > *{pointer-events:auto}
.tb{background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:6px 13px; cursor:pointer; font-size:13.5px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.tb:hover{border-color:var(--accent)}
.tb[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.seg{display:inline-flex; background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:2px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.seg button{border:0; background:none; padding:4px 11px; border-radius:7px; cursor:pointer; font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:15px; padding:20px; text-align:center}

html[dir="ltr"] .ph .sub,html[dir="ltr"] .card .en,html[dir="ltr"] .brand .en{direction:rtl; text-align:left}
html[dir="ltr"] .readout dd{text-align:right}
html[dir="rtl"] #oReg{direction:rtl}
html[dir="ltr"] .parts li button{text-align:left}
html[dir="ltr"] .parts li button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
html[dir="ltr"] .lbl .t{direction:ltr}
html[dir="ltr"] .card .eq{border-radius:0 6px 6px 0}
html[dir="rtl"] .card .eq{border-radius:6px 0 0 6px}
@media (max-width:820px){
  html,body{height:auto}
  .app{grid-template-columns:1fr; height:auto}
  .stage{order:-1; height:66svh; min-height:380px}
  .panel{border-inline-end:0; overflow:visible}
  .hint{display:none}
  .ovl{top:10px; inset-inline-start:10px}
  .brand{padding:6px 10px}
  .legend{font-size:12px; padding:4px 9px}
  .brand .who{font-size:15px}
  .brand .org{display:none}
  .toolbar{bottom:10px; gap:6px}
  .tb,.seg button{font-size:12.5px}
}
.prof-h{margin-top:14px !important}
.prof{display:grid; grid-template-columns:auto 1fr auto; gap:3px 8px; align-items:center; font-size:12.5px; font-variant-numeric:tabular-nums}
.prof .k{color:var(--muted)}
.prof .tr{height:9px; background:var(--line); border-radius:5px; overflow:hidden}
.prof .tr div{height:100%; border-radius:5px; transition:width .3s}
.prof .v{direction:ltr}
.legend i.grad{width:34px; border-radius:6px; background:linear-gradient(90deg,#f2c21b,#e23b32)}
html[dir="rtl"] .legend i.grad{background:linear-gradient(270deg,#f2c21b,#e23b32)}
.legend i.bub{background:transparent; box-shadow:inset 0 0 0 2px #e9844a}
@media (max-width:820px){
  .stage{height:auto; min-height:0; display:flex; flex-direction:column}
  #c{height:60svh; min-height:340px; flex:none}
  .toolbar{position:static; inset:auto; padding:10px 10px 12px; background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .labels{bottom:auto; height:max(60svh,340px)}
}
.tb.fl{border-color:#b3362b; color:#b3362b; font-weight:600}
.tb.fl[aria-pressed="true"]{background:#b3362b; color:#fff}
.fwarn{background:#b3362b; color:#fff; border-radius:10px; padding:6px 12px; font-size:13.5px; font-weight:600; max-width:340px; box-shadow:0 2px 8px rgba(120,20,10,.3)}
.fwarn[hidden]{display:none}
.card.fcard{border-color:#b3362b; border-inline-start:4px solid #b3362b}
.card.fcard h2{color:#b3362b}
.card ul{margin:6px 0; padding-inline-start:20px}
.card li{margin:2px 0}
.card h4{margin:10px 0 2px; font-size:14.5px}
#chart svg{width:100%; height:auto; display:block}
#chart text{font-size:10px; fill:var(--muted); font-family:inherit}
.ch-leg{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--muted); margin-top:4px}
.ch-leg i{display:inline-block; width:16px; height:3px; border-radius:2px; vertical-align:middle; margin-inline-end:5px}
.fwarn.ok{background:#1f8a4c}
.legend i.sw{width:34px; border-radius:6px; background:linear-gradient(90deg,#ff3b1f,#1f5fff)}
.legend i.gw{width:34px; border-radius:6px; background:linear-gradient(90deg,#9be38a,#f4f4f4)}
html[dir="rtl"] .legend i.sw{background:linear-gradient(270deg,#ff3b1f,#1f5fff)}
html[dir="rtl"] .legend i.gw{background:linear-gradient(270deg,#9be38a,#f4f4f4)}
.pkseg{display:flex; width:100%}
.pkseg button{flex:1; padding:6px 3px; font-size:12.5px}
#chart2 svg{width:100%;height:auto;display:block;margin-top:8px}#chart2 text{font-size:10px;fill:var(--muted);font-family:inherit}
#chart svg,#chart2 svg,#chart3 svg{width:100%;height:auto;display:block;margin-top:8px}#chart text,#chart2 text,#chart3 text{font-size:10px;fill:var(--muted);font-family:inherit}
.fwarn.bad{background:#c8352e}
.presenter{position:absolute; top:12px; inset-inline-end:12px; width:min(290px,calc(100% - 24px)); display:flex; gap:9px; align-items:flex-start; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:8px 9px; box-shadow:0 4px 16px rgba(10,20,30,.2); z-index:5}
.presenter[hidden]{display:none}
.pv{position:relative; flex:none; width:52px; height:52px}
.pv img{width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:50% 30%; position:relative; z-index:1; border:2px solid var(--panel)}
.pv .ring{position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(#1f8a4c,#1f78c8,#1f8a4c); opacity:.35}
.presenter.talking .pv img{animation:talk 2.4s ease-in-out infinite}
.presenter.talking .pv .ring{opacity:1; animation:spin 3s linear infinite}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-1px) scale(1.02) rotate(-.6deg)}50%{transform:translateY(0) scale(1.005)}75%{transform:translateY(-1px) scale(1.015) rotate(.6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pv .bars{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:2; background:var(--panel); border-radius:6px; padding:2px 4px; border:1px solid var(--line)}
.pv .bars i{display:block; width:2px; height:4px; background:#1f8a4c; border-radius:2px}
.presenter.talking .bars i{animation:bar .9s ease-in-out infinite}
.presenter.talking .bars i:nth-child(2){animation-delay:.15s}.presenter.talking .bars i:nth-child(3){animation-delay:.3s}.presenter.talking .bars i:nth-child(4){animation-delay:.45s}.presenter.talking .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:3px}50%{height:10px}}
.pb{flex:1; min-width:0}
.pn{font-weight:700; font-size:12.5px; line-height:1.3}
.pn span{font-weight:500; color:var(--muted); font-size:11.5px; margin-inline-start:4px}
.pt{font-size:12.5px; line-height:1.6; margin:3px 0 5px; max-height:4.9em; overflow-y:auto}
.pc{display:flex; gap:4px}
.pc .ic{background:var(--chip); border:1px solid var(--line); border-radius:7px; width:28px; height:24px; padding:0; font-size:11px; line-height:1; cursor:pointer}
.pc .ic:hover{border-color:var(--accent)}
html[dir="rtl"] .pc .flip{transform:scaleX(-1)}
.pw{margin-top:4px; font-size:11px; color:#c0621c}
.pbtn{position:absolute; top:12px; inset-inline-end:12px; z-index:5; width:46px; height:46px; border-radius:50%; padding:0; border:2px solid #1f8a4c; background:var(--panel); cursor:pointer; box-shadow:0 3px 10px rgba(10,20,30,.2)}
.pbtn img{width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 30%}
.pbtn span{position:absolute; bottom:-3px; inset-inline-end:-3px; width:18px; height:18px; border-radius:50%; background:#1f8a4c; color:#fff; font-size:9px; display:grid; place-items:center}
.pbtn[hidden]{display:none}
.stage.tour .hint{display:none}
@media (max-width:820px){.presenter{top:8px; inset-inline-end:8px; width:min(270px,calc(100% - 16px))}.pbtn{top:8px}.stage.tour .ovl{display:none}}
.stage .hint{inset-inline-end:70px}
.wm{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;user-select:none;font:600 11px/1.2 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;opacity:.5;text-shadow:0 0 3px rgba(0,0,0,.85),0 0 1px #000;white-space:nowrap;letter-spacing:.2px}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="ph">
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <button class="lang" data-lang-toggle>English</button>
    </header>
    <section class="card" id="card" aria-live="polite"></section>
    <section class="mix">
      <h3 data-t="opExp"></h3>
      <div class="seg pkseg" role="group">
        <button data-exp="7" aria-pressed="true"></button>
        <button data-exp="8" aria-pressed="false"></button>
        <button data-exp="9" aria-pressed="false"></button>
        <button data-exp="10" aria-pressed="false"></button>
        <button data-exp="11" aria-pressed="false"></button>
      </div>
      <h3 data-t="opType" style="margin-top:12px"></h3>
      <div class="seg pkseg" role="group">
        <button data-ctype="P" aria-pressed="false">P</button>
        <button data-ctype="PI" aria-pressed="false">PI</button>
        <button data-ctype="PD" aria-pressed="false">PD</button>
        <button data-ctype="PID" aria-pressed="true">PID</button>
      </div>
      <h3 data-t="opMode" style="margin-top:10px"></h3>
      <div class="seg pkseg" role="group">
        <button data-amode="auto" aria-pressed="true"></button>
        <button data-amode="man" aria-pressed="false"></button>
        <button data-dir="INV" aria-pressed="true">INV</button>
        <button data-dir="DIR" aria-pressed="false">DIR</button>
      </div>
      <h3 data-t="opSp" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="sp" min="0" max="100" step="1" value="20" aria-label="Set point"><output id="spOut">–</output></div>
      <h3 data-t="opKp" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="kp" min="0.01" max="6" step="0.001" value="0.241" aria-label="Kp"><output id="kpOut">–</output></div>
      <h3 data-t="opTn" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="tn" min="0.01" max="3" step="0.001" value="1.136" aria-label="Tn"><output id="tnOut">–</output></div>
      <h3 data-t="opTv" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="tv" min="0" max="0.5" step="0.001" value="0.171" aria-label="Tv"><output id="tvOut">–</output></div>
      <h3 data-t="opMan" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="mv" min="0" max="100" step="0.5" value="25" aria-label="Manual output"><output id="mvOut">–</output></div>
      <h3 data-t="opDist" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="ds" min="0" max="100" step="1" value="30" aria-label="Disturbance"><output id="dsOut">–</output></div>
      <h3 id="vxH" data-t="opVx" style="margin-top:10px"></h3>
      <div class="rpm" id="vxBox"><input type="range" id="vx" min="0" max="40" step="1" value="10" aria-label="Extra air volume"><output id="vxOut">–</output></div>
      <h3 data-t="opSpd" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="sd" min="0" max="2" step="0.05" value="1" aria-label="Simulation speed"><output id="sdOut">–</output></div>
      <dl class="readout">
        <dt data-t="dSig"></dt><dd id="oSig">–</dd>
        <dt data-t="dMet"></dt><dd id="oMet">–</dd>
        <dt data-t="dOvr"></dt><dd id="oOvr">–</dd>
        <dt data-t="dId"></dt><dd id="oId">–</dd>
        <dt data-t="dZn"></dt><dd id="oZn">–</dd>
        <dt data-t="dTf"></dt><dd id="oTf">–</dd>
        <dt data-t="dVal"></dt><dd id="oVal">–</dd>
        <dt data-t="dTm"></dt><dd id="oTm">–</dd>
      </dl>
      <h3 class="prof-h" data-t="chH"></h3>
      <div id="chart"></div>
      <div id="chart2"></div>
      <div id="chart3"></div>
      <p class="fine" data-t="fine"></p>
    </section>
    <footer class="credit" data-t="credit"></footer>

  fine:'محاكاة لأجهزة الحلقات الأربع في RT 578: المستوى (7) والتدفق (8) بحسب دليل مختبر السيطرة على العمليات (الجامعة التكنولوجية، إعداد سناء وثيق ونسمة بلاسم، إشراف د. زيدون محسن) وكتاب المحاضرات (د. زيدون محسن شكور)، وأضفتُ الضغط (9) والحرارة بنقطتين وبـ PI (10 و11) اعتماداً على وصف الجهاز. ما تحققتُ منه من مصادر: [1] GUNT Hamburg، صفحة المنتج RT 578 «Control of four variables from process engineering»: الجهاز يضبط التدفق والمستوى والضغط والحرارة؛ دارة بخزان شفاف مدرّج للتدفق والمستوى والضغط؛ اضطراب يُولَّد بصمام في مخرج الخزان للمستوى والضغط؛ وصمام عند رأس الخزان يتيح دراسة المستوى مع ضغط مضاد وبدونه؛ وتجارب منها التحكم المتتالي (مستوى–تدفق وحرارة–تدفق) والتحكم بنقطتين للحرارة. [2] تقرير مختبر MCTX3420 (جامعة غرب أستراليا) عن ربط الجهاز بحاسوب: في وضع الضغط يُغلق صمام رأس الخزان فيرتفع ضغط الهواء مع المستوى، وفي وضع الحرارة يُحوَّل ماء العملية عبر المبادل الحراري ويتجاوز خزان المستوى. تصحيح لما بنيتُه سابقاً: كنتُ افترضتُ أن V19 المفتوح يعطي تموجاً في قراءة المستوى، وهذا افتراض لا سند له؛ وخطوتا الدليل 12 و14 تجريان بعد إغلاق V19، أي مع وسادة هوائية وضغط مضاد، فنمذجتُ هذه الحالة فيزيائياً (قانون الغاز المتساوي الحرارة). ما أخذته حرفياً من الدليل للتجربتين 7 و8: خطوات التجربتين وجدولا الصمامات، وضبط PID (المستوى Kp = 0.241 وTn = 1.136 min وTv = 0.171 min؛ التدفق Kp = 2.075 وTn = 0.073 وTv = 0.011)، وخطوتا المرجع (20% ← 60% و10% ← 40%)، وفاصلا التسجيل (60 s و10 s). ما افترضتُه لأنني لا أعرف قيمه في الجهاز (افتراضي وليس قياساً): عمود B2 بقطر 0.12 m وارتفاع 0.45 m، وتصريف V14 بقانون الجذر التربيعي على الرأس الكلي مع k = 1.2×10⁻⁴·(θ/90)^1.5، وأقصى تدفق للمضخة 7 L/min، وتأخر الصمام 3 s والحساس 2 s وزمن ميت 2 s؛ وحجم هواء إضافي فوق الماء 10 L (منزلق قابل للتغيير) ضبطته ليوافق «زمن 600 s» الذي يلمّح إليه الدليل، فمع الخزان وحده (0 L) تصبح الوسادة الهوائية شديدة الصلابة ولا تستقر إعدادات الدليل؛ ومدى مقياس الضغط 0–50 kPa. حلقة الحرارة: مسخّن 1500 W، وسعة دارة التسخين 12.6 kJ/K ومبادل UA = 300 W/K بطريقة ε–NTU، وخزان B1 كتلته 20 kg بملف تبريد UA = 200 W/K، وزمن ميت 10 s وتأخر حساس 5 s، ومنظم أمان للدارة عند 75°C، وتدفق خطي مع فتحة V6، وجدول صمامات الحرارة (V7 مغلق وV8 مفتوح) استنتجتُه من مخطط الأنابيب لأنه غير معطى في الدليل. وضبط المتحكم في التجارب 9 و10 و11 من اختياري وليس من الدليل (الضغط: PI بـ Kp = 4 وTn = 60 s؛ الحرارة: PI بفعل مباشر Kp = 2 وTn = 100 s؛ النقطتان: صمام 12% ونطاق ±1°C). لم أنفّذ التحكم المتتالي. التحقق: قانون الغاز p·V ثابت، وميزان الطاقة يغلق (1500 W = تبادل المبادل + الفقد)، ومحلّ الحالة المستقرة يطابق المعادلات التفاضلية، وتجربة الدليل 7 في الخزان المغلق تعطي صعوداً 384 s واستقراراً 493 s وتجاوزاً 0.1% بإعداداتها، وفي الخزان المفتوح بالمعاملات نفسها تجاوزاً 28% واستقراراً 808 s؛ والتحكم بالضغط يستقر في 37 s بتجاوز 7.5%؛ والحرارة PI تتبع خطوة 35←45°C في 168 s بلا إزاحة وتتحمل اضطراب ملف التبريد بانحراف 0.39°C؛ والتحكم بنقطتين يتأرجح بين 37.7 و41.0°C حول 40°C (النطاق ±1، الدورة 190 s). وتبقى الاختبارات السابقة: المقاييس تعيد تجاوز نظام الرتبة الثانية (16.30%)، والتعرف يسترجع نباتاً معلوماً، وإزاحة P تطابق Δ/(1+Kp·K). ولأن زمن الميت المقدَّر بالملاءمة لحلقة الحرارة قريب من الصفر (استجابة المبادل لتغير التدفق شبه فورية ثم تتباطأ)، أطبّق قواعد منحنى الاستجابة (زيغلر–نيكولز وكوهن–كون) بقيمة θ لا تقل عن 0.1τ، وإلا خرجت كسوب غير معقولة. تنبيه على الدليل: صيغة معامل التخميد φ في التجربة 3 لا تطابق اشتقاق معادلة القوى فيه.',

  fine:'A simulation of the four loops of the RT 578: level (7) and flow (8) according to the Process Control Laboratory manual (University of Technology, prepared by Sana Wathiq and Nesma Balasim, supervised by Dr. Zaidoon Mohsin) and the lecture book (Dr. Zaidoon M. Shakoor), to which I added pressure (9) and temperature with PI and two-point control (10 and 11) based on the description of the trainer. What I verified from sources: [1] G.U.N.T. Hamburg, product page RT 578 “Control of four variables from process engineering”: the trainer controls flow rate, level, pressure and temperature; a circuit with a graduated transparent tank for flow, level and pressure; a disturbance generated by a valve in the tank outlet for level and pressure; a valve at the tank head that allows level control with and without counter pressure; and experiments that include cascade control (level–flow and temperature–flow) and two-point control of temperature. [2] The MCTX3420 laboratory report (University of Western Australia) on connecting the trainer to a computer: in pressure mode the tank-head valve is closed so the air pressure rises with the level, and in temperature mode the process water is diverted through the heat exchanger and bypasses the level tank. A correction to what I built earlier: I had assumed that an open V19 gives a small ripple in the level reading, which has no support; and steps 12 and 14 of the manual are carried out after closing V19, that is with an air cushion and a counter pressure, so I now model that case physically (the isothermal gas law). Taken literally from the manual for experiments 7 and 8: the steps and the two valve tables, the PID settings (level Kp = 0.241, Tn = 1.136 min, Tv = 0.171 min; flow Kp = 2.075, Tn = 0.073, Tv = 0.011), the two set-point steps (20% → 60% and 10% → 40%), and the recording intervals (60 s and 10 s). What I assumed because I do not know the values on the trainer (assumed, not measured): the column B2 0.12 m in diameter and 0.45 m high, the V14 drain by the square-root law on the total head with k = 1.2×10⁻⁴·(θ/90)^1.5, a maximum pump flow of 7 L/min, a valve lag of 3 s, a sensor lag of 2 s and a dead time of 2 s; an extra air volume above the water of 10 L (an adjustable slider) that I tuned to match the “600 s time base” that the manual hints at, since with the tank alone (0 L) the air cushion is so stiff that the manual’s settings do not settle; and a pressure gauge range of 0–50 kPa. The temperature loop: a 1500 W heater, a heating-circuit capacity of 12.6 kJ/K and an exchanger of UA = 300 W/K by the ε–NTU method, a B1 tank of 20 kg with a cooling coil of UA = 200 W/K, a dead time of 10 s and a sensor lag of 5 s, a safety thermostat on the circuit at 75°C, a flow linear in the V6 opening, and the valve table for the temperature experiments (V7 closed and V8 open), which I inferred from the piping layout since the manual does not give it. The controller settings in experiments 9, 10 and 11 are my own choice and not from the manual (pressure: PI with Kp = 4 and Tn = 60 s; temperature: direct-acting PI with Kp = 2 and Tn = 100 s; two-point: a 12% valve and a ±1°C band). I did not implement cascade control. Verification: the gas law p·V is constant, the energy balance closes (1500 W = exchanger duty + loss), the steady-state solver matches the differential equations, and manual experiment 7 in the closed tank gives a rise of 384 s, a settling time of 493 s and an overshoot of 0.1% with its settings, while in the open tank with the same parameters it gives an overshoot of 28% and a settling time of 808 s; pressure control settles in 37 s with a 7.5% overshoot; the PI temperature loop follows a 35→45°C step in 168 s with no offset and handles a cooling-coil disturbance with a 0.39°C deviation; and two-point control swings between 37.7 and 41.0°C around 40°C (band ±1, period 190 s). The earlier tests still hold: the metrics reproduce the second-order overshoot (16.30%), the identification recovers a known plant, and the P-only offset matches Δ/(1+Kp·K). Because the dead time estimated by the fit for the temperature loop is close to zero (the exchanger responds almost at once to a change of flow and then slows down), I apply the reaction-curve rules (Ziegler–Nichols and Cohen–Coon) with θ not below 0.1τ, otherwise they give unreasonable gains. A note on the manual: the damping-factor formula φ of experiment 3 does not match the derivation of its own force balance.',

 for(let i=0;i<NPL;i++){const d=pD[i];let P=null,sp=0,vis=true;if(d.k===0){P=LVL()?PA7:(EXP>=10?PAT:PA8);sp=.15+fp/100*1.9;}else{P=PAD;sp=.1+drainFrac()*2.2;vis=LVL()&&lv>1;}
  if(!vis||(d.k===0&&fp<1)){PLP.pos[i*3+1]=-50;continue;}if(running)d.s=(d.s+dt*sp*d.sp)%P.T;const s=Math.min(d.s,P.T);at(P,s,_p);
  PLP.pos[i*3]=_p.x+d.j[0];PLP.pos[i*3+1]=_p.y+d.j[1];PLP.pos[i*3+2]=_p.z+d.j[2];let c=d.c?CWAT:CWAT2;if(EXP>=10&&d.k===0){const a=PAT.L[9],b=PAT.L[10],Tv=s<a?PL.Tb:s<b?PL.Tb+(PL.To-PL.Tb)*(s-a)/(b-a):PL.To;tcol(Tv,_c);c=_c;}PLP.col[i*3]=c.r;PLP.col[i*3+1]=c.g;PLP.col[i*3+2]=c.b;}

 if(NEEDLE)NEEDLE.rotation.z=Math.PI*.75-(typeof PL.pg==='function'?Math.min(1,PL.pg(PL.h)/6e4):0)*Math.PI*1.5;

(function(){
const CFG={btn:"bRun",isOn:()=>running,tour:[[null, "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ. أَنا المُهَنْدِسُ عَلاءُ مُحَمَّد، مِنْ قِسْمِ الهَنْدَسَةِ الكيمْياوِيَّةِ في جامِعَةِ البَصْرَة. أَهْلاً بِكُمْ في هذا المُحاكي ثُلاثِيِّ الأَبْعادِ لِجِهازِ السَّيْطَرَةِ عَلى العَمَلِيّاتِ آرْ تي ٥٧٨. سَأُعَرِّفُكُمْ عَلى أَجْزائِهِ الرَّئيسَة، ثُمَّ نُشاهِدُ مَعاً أَرْبَعُ حَلَقاتٍ: المُسْتَوى وَالتَّدَفُّقُ وَالضَّغْطُ وَالحَرارَة.", "Hello and welcome. I am Engineer Alaa Mohammed from the Department of Chemical Engineering at the University of Basrah. Welcome to this three-dimensional simulator of the RT 578 process control trainer. I will introduce its main parts, and then we will watch together four loops: level, flow, pressure and temperature."], ["v6", "هذا صِمامُ التَّحَكُّمِ. يُغَيِّرُ المُتَحَكِّمُ فَتْحَتَهُ فَيَتَغَيَّرُ تَدَفُّقُ الماءِ الَّذي تَدْفَعُهُ المِضَخَّة. هُوَ المُؤَثِّرُ في كُلِّ الحَلَقاتِ الأَرْبَع.", "This is the control valve. The controller changes its opening so the flow of water driven by the pump changes. It is the actuator in all four loops."], ["b2", "وَهذا عَمودُ المُسْتَوى. عِنْدَ إِغْلاقِ الصِّمامِ العُلْوِيِّ تُحْبَسُ فَوْقَ الماءِ وِسادَةٌ هَوائِيَّةٌ، فَكُلَّما ارْتَفَعَ المُسْتَوى ارْتَفَعَ الضَّغْط. وَهكَذا يَصيرُ الضَّغْطُ مُتَغَيِّراً نَضْبُطُهُ بِتَدَفُّقِ الدُّخول.", "This is the level column. When the top valve is closed an air cushion is trapped above the water, so the pressure rises with the level. The pressure then becomes a variable we control with the inflow."], ["therm", "وَهذِهِ الحَلَقَةُ الحَمْراءُ لِلحَرارَة. يُسَخِّنُ المُسَخِّنُ ماءَ دارَةٍ مُغْلَقَة، وَتَنْقُلُ الدّارَةُ الحَرارَةَ إِلى ماءِ العَمَلِيَّةِ في المُبادِل. كُلَّما زادَ التَّدَفُّقُ قَلَّتْ حَرارَةُ الخُروج. وَيُمْكِنُ ضَبْطُها بِـ بي آي أَوْ بِالقَطْعِ وَالوَصْلِ بِنُقْطَتَيْن.", "This is the red temperature loop. The heater heats the water of a closed circuit, which passes the heat to the process water in the exchanger. The more the flow, the lower the outlet temperature. It can be controlled by PI or by two-point switching."], ["ctrl", "وَهذا المُتَحَكِّم. يَقيسُ المُتَغَيِّرَ وَيُقارِنُهُ بِالمَطْلوبِ وَيَحْسِبُ فَتْحَةَ الصِّمام. جَرِّبوا الضَّبْطَ الَّذي في الدَّليلِ لِلمُسْتَوى وَالتَّدَفُّق، ثُمَّ ضَبْطي لِلضَّغْطِ وَالحَرارَة.", "This is the controller. It measures the variable, compares it with the wanted value and calculates the valve opening. Try the manual’s settings for level and flow, then mine for pressure and temperature."], [null, "جَرِّبوا الآنَ: في تَجْرِبَةِ المُسْتَوى أَغْلِقوا وَافْتَحوا الصِّمامَ العُلْوِيَّ وَقارِنوا. وَفي الحَرارَةِ قارِنوا التَّحَكُّمَ بِـ بي آي بِالتَّحَكُّمِ بِنُقْطَتَيْنِ مِنْ حَيْثُ التَّأَرْجُحُ وَالإِزاحَة. بِالتَّوْفيقِ لِلْجَميع.", "Now try it yourselves: in the level experiment close and open the top valve and compare. In temperature compare PI with two-point control for the swing and the offset. Good luck to you all."]]};

function pickVoice(){if(!synth)return;const v=synth.getVoices();

 const en=v.filter(x=>/^en/i.test(x.lang)),se=x=>(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?4:0)+(/ryan|guy|george|daniel|david|arthur|male/i.test(x.name)?3:0)+(/en[-_]GB/i.test(x.lang)?2:0);
 enVoice=en.sort((a,b)=>se(b)-se(a))[0]||null;}

function chunks(t){return t.split(/(?<=[.،,:;!?؟])\s+/).reduce((a,s)=>{if(a.length&&(a[a.length-1]+' '+s).length<170)a[a.length-1]+=' '+s;else a.push(s);return a;},[]);}
