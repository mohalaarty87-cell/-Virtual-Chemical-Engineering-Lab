.presenter{position:absolute; top:12px; inset-inline-end:12px; width:min(290px,calc(100% - 24px)); display:flex; gap:9px; align-items:flex-start; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:8px 9px; box-shadow:0 4px 16px rgba(10,20,30,.2); z-index:5}

.pv{position:relative; flex:none; width:52px; height:52px}

.pv .ring{position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(#1f8a4c,#1f78c8,#1f8a4c); opacity:.35}

@keyframes spin{to{transform:rotate(360deg)}}
.pv .bars{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:2; background:var(--panel); border-radius:6px; padding:2px 4px; border:1px solid var(--line)}
.pv .bars i{display:block; width:2px; height:4px; background:#1f8a4c; border-radius:2px}
.presenter.talking .bars i{animation:bar .9s ease-in-out infinite}
.presenter.talking .bars i:nth-child(2){animation-delay:.15s}.presenter.talking .bars i:nth-child(3){animation-delay:.3s}.presenter.talking .bars i:nth-child(4){animation-delay:.45s}.presenter.talking .bars i:nth-child(5){animation-delay:.6s}

.pb{flex:1; min-width:0}
.pn{font-weight:700; font-size:12.5px; line-height:1.3}

.pbtn img{width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 30%}
.pbtn span{position:absolute; bottom:-3px; inset-inline-end:-3px; width:18px; height:18px; border-radius:50%; background:#1f8a4c; color:#fff; font-size:9px; display:grid; place-items:center}
.pbtn[hidden]{display:none}
.stage.tour .hint{display:none}
@media (max-width:820px){.presenter{top:8px; inset-inline-end:8px; width:min(270px,calc(100% - 16px))}.pbtn{top:8px}.stage.tour .ovl{display:none}}
.stage .hint{inset-inline-end:70px}
.wm{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;user-select:none;font:600 11px/1.2 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;opacity:.5;text-shadow:0 0 3px rgba(0,0,0,.85),0 0 1px #000;white-space:nowrap;letter-spacing:.2px}

<div class="app">

<div class="wm" aria-hidden="true">© 2026 د. ضياء جمعة جاسم · Dr. Dheyaa J. Jasim</div>
    <div class="labels" id="labels"></div>

      <div class="brand"><div class="who" data-t="who"></div><div class="en" data-t="whoAlt"></div><div class="org" data-t="org"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const loadingEl=document.getElementById('loading');
if(!window.THREE||!THREE.OrbitControls){loadingEl.textContent='تعذّر تحميل مكتبة الرسم ثلاثي الأبعاد. تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة. / The 3D library could not load; check your connection and reload.';return;}

/* ================= model: Merkel method, counterflow induced draft ================= */
const PA=101.325,CPW=4.186,LW=50,GMAX=55,COC=4;
const psat=T=>.61078*Math.exp(17.27*T/(T+237.3));
const hsat=T=>{const p=psat(T),W=.622*p/(PA-p);return 1.006*T+W*(2501+1.86*T);};

const CFG={btn:"bRun",isOn:()=>running,tour:[[null, "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ. أَنا الدُّكْتورْ ضِياءْ جُمْعَة جاسِمْ، تَدْريسِيٌّ في قِسْمِ الهَنْدَسَةِ الكيمْياوِيَّةِ وَالصِّناعاتِ النِّفْطِيَّةِ في كُلِّيَّةِ العَمارَةِ الجامِعَة، وَأُدَرِّسُ مادَّتَيِ انْتِقالِ الكُتْلَةِ وَتَصْميمِ المُفاعِلات. أَهْلاً بِكُمْ في هذا المُحاكي ثُلاثِيِّ الأَبْعادِ لِبُرْجِ التَّبْريد. سَأُعَرِّفُكُمْ عَلى أَجْزائِهِ الرَّئيسَة، ثُمَّ نُشاهِدُ مَعاً كَيْفَ يَبْرُدُ الماءُ بِالتَّبْخيرِ عِنْدَما يُلامِسُ الهَواء.", "Hello and welcome. I am Doctor Dheyaa J. Jasim, a lecturer in the Department of Chemical Engineering and Petroleum Industries at Al-Amarah University College, where I teach Mass Transfer and Reactor Design. Welcome to this three-dimensional simulator of a cooling tower. I will introduce its main parts, and then we will watch together how water is cooled by evaporation as it meets the air."], ["hotIn", "يَصِلُ الماءُ السّاخِنُ الأَحْمَرُ العائِدُ مِنَ المَصْنَعِ عَبْرَ هذا الخَطِّ إِلى أَعْلى البُرْج.", "Hot red water returning from the plant arrives through this line at the top of the tower."], ["distribution", "ثُمَّ يَتَوَزَّعُ في هذِهِ الأَنابيب، وَتَرُشُّهُ الفوهاتُ بِانْتِظامٍ عَلى الحَشْوَة.", "It then spreads through these pipes, and the nozzles spray it evenly onto the fill."], ["fill", "وَهذِهِ الحَشْوَة، صَفائِحُ مُمَوَّجَةٌ يَنْتَشِرُ عَلَيْها الماءُ كَغِشاءٍ رَقيق. هُنا يُلامِسُ الماءُ الهَواءَ الصّاعِد، فَيَتَبَخَّرُ جُزْءٌ صَغيرٌ مِنْه، وَيَبْرُدُ الباقي. لاحِظوا كَيْفَ يَتَحَوَّلُ لَوْنُ الماءِ مِنَ الأَحْمَرِ إِلى الأَزْرَق.", "This is the fill, corrugated sheets over which the water spreads as a thin film. Here it meets the rising air; a small part evaporates and the rest cools. Watch the water turn from red to blue."], ["louvers", "يَدْخُلُ الهَواءُ الجَوِّيُّ الأَخْضَرُ مِنْ هذِهِ الفَتَحاتِ عَلى الجَوانِبِ الأَرْبَعَة، ثُمَّ يَصْعَدُ عَكْسَ اتِّجاهِ الماء.", "Ambient air, shown green, enters through these louvers on all four sides and rises against the water."], ["eliminators", "فَوْقَ الرَّشّاشاتِ مانِعاتُ الرَّذاذ، تَلْتَقِطُ القَطَراتِ الَّتي يَحْمِلُها الهَواءُ فَلا تَضيع.", "Above the sprays are the drift eliminators, which catch droplets carried by the air so they are not lost."], ["fan", "وَفي القِمَّةِ المِرْوَحَة، تَسْحَبُ الهَواءَ مِنَ الأَسْفَلِ إِلى الأَعْلى، فَيَخْرُجُ رَطْباً سَماوِيّاً مِنَ المِدْخَنَة. وَسُرْعَتُها تُحَدِّدُ نِسْبَةَ الماءِ إِلى الهَواء.", "At the top is the fan, which draws the air upward so it leaves moist and cyan from the stack. Its speed sets the water-to-air ratio."], ["drive", "يُديرُها هذا المُحَرِّكُ عَبْرَ عَمودٍ وَصُنْدوقِ تُروس، وَهُوَ خارِجَ تَيّارِ الهَواءِ الرَّطْب.", "This motor drives it through a shaft and gearbox, and it sits outside the moist air stream."], ["basin", "يَسْقُطُ الماءُ البارِدُ الأَزْرَقُ إِلى هذا الحَوْض، وَمِنْهُ تَسْحَبُهُ مِضَخَّةُ التَّدْويرِ إِلى المَصْنَع.", "The cold blue water falls into this basin, and the circulating pump sends it back to the plant."], ["makeup", "وَبِما أَنَّ جُزْءاً مِنَ الماءِ يَتَبَخَّر، يُعَوِّضُهُ خَطُّ التَّعْويضِ بِصِمامِ العَوّامَة، وَيُصَرَّفُ جُزْءٌ آخَرُ لِمَنْعِ تَرَكُّزِ الأَمْلاح.", "Because some water evaporates, the make-up line with its float valve replaces it, and some is blown down to stop salts building up."], [null, "غَيِّروا حَرارَةَ الماءِ وَحَرارَةَ البُصَيْلَةِ الرَّطْبَةِ وَسُرْعَةَ المِرْوَحَة، وَراقِبوا المَدى وَالاقْتِرابَ وَمُخَطَّطَ الإِنْثالْبي. لاحِظوا أَنَّ الماءَ لا يَبْرُدُ أَبَداً إِلى ما دونَ حَرارَةِ البُصَيْلَةِ الرَّطْبَة. ثُمَّ جَرِّبوا زِرَّ التَّكَلُّس. بِالتَّوْفيقِ لِلْجَميع.", "Change the water temperature, the wet-bulb temperature and the fan speed, and watch range, approach and the enthalpy diagram. Notice that the water never cools below the wet-bulb temperature. Then try the scaling button. Good luck to you all."]]};
