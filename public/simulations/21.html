.presenter[hidden]{display:none}
.pv{position:relative; flex:none; width:52px; height:52px}

.pv .ring{position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(#1f8a4c,#1f78c8,#1f8a4c); opacity:.35}

.pv .bars{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:2; background:var(--panel); border-radius:6px; padding:2px 4px; border:1px solid var(--line)}
.pv .bars i{display:block; width:2px; height:4px; background:#1f8a4c; border-radius:2px}

.presenter.talking .bars i:nth-child(2){animation-delay:.15s}.presenter.talking .bars i:nth-child(3){animation-delay:.3s}.presenter.talking .bars i:nth-child(4){animation-delay:.45s}.presenter.talking .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:3px}50%{height:10px}}
.pb{flex:1; min-width:0}

const DD=1.2,LL=8,SL=.04,AD=Math.PI*DD*DD/4,VD=AD*LL,MG=2.0,CPG=1.1,LAM=2350,TW=55,XEQ=.005,XIN=.30,CPS=1.0,RHOB=600,DPUM=2000,XSPEC=.05;
let TIN=400,FEED=3000,RPM=4,SOL=null;
function solve(){const Fd=FEED/3600,Glb=MG*3600/AD*.2048,Ua=.5*Math.pow(Glb,.67)/(DD*3.2808)*18.63,NTU=Ua*VD/(MG*CPG*1000);
 const Tg=f=>TW+(TIN-TW)*Math.exp(-NTU*f),Xw=f=>XIN-MG*CPG*(TIN-Tg(f))/LAM/Fd;
 let fs=1;if(Xw(1)<XEQ){let lo=0,hi=1;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(Xw(m)<XEQ)hi=m;else lo=m;}fs=(lo+hi)/2;}
 const TgF=f=>f<=fs?Tg(f):TW+(Tg(fs)-TW)*Math.exp(-.35*NTU*(f-fs)),XF=f=>f<=fs?Math.max(XEQ,Xw(f)):XEQ;
 const Tout=TgF(1),evap=(XIN-XF(1))*FEED,Ts=fs<1?Math.max(TW,Math.min(Tout-10,TW+MG*CPG*(Tg(fs)-Tout)/(Fd*CPS))):TW;
 const Flb=FEED/AD*.2048,B=5/Math.sqrt(DPUM),tau=Math.max(1,.23*LL*3.2808/(SL*Math.pow(RPM,.9)*DD*3.2808)-.6*B*LL*3.2808*Glb/Flb); /* Friedman & Marshall, co-current, minutes */
 SOL={Ua,NTU,Tg:TgF,X:XF,Tout,Xout:XF(1),evap,fs,Ts,tau,hold:FEED*(1+XIN/2)*tau/60/RHOB/VD,vp:Math.PI*DD*RPM/60,eta:(TIN-Tout)/(TIN-25)};}

(function(){
const CFG={btn:"bRun",isOn:()=>running,tour:[[null, "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ. أَنا المُهَنْدِسُ عَلاءُ مُحَمَّد، مِنْ قِسْمِ هَنْدَسَةِ المَوادِ في جامِعَةِ البَصْرَة. أَهْلاً بِكُمْ في هذا المُحاكي ثُلاثِيِّ الأَبْعادِ لِلْمُجَفِّفِ الدَّوّار. سَأُعَرِّفُكُمْ عَلى أَجْزائِهِ جُزْءاً جُزْءاً، ثُمَّ نُشاهِدُ مَعاً كَيْفَ تَجِفُّ المادَّةُ داخِلَه.", "Hello and welcome. I am Engineer Alaa Mohammed from the Department of Materials Engineering at the University of Basrah. Welcome to this three-dimensional simulator of a rotary dryer. I will introduce its parts one by one, and then we will watch together how the material dries inside it."], ["drum", "هذِهِ هِيَ الأُسْطُوانَةُ الدَّوّارَة، قَلْبُ المُجَفِّف. طولُها ثَمانِيَةُ أَمْتار، وَقُطْرُها مِتْرٌ وَعِشْرونَ سَنْتيمِتْراً، وَهِيَ مائِلَةٌ قَليلاً وَدَوَرانُها بَطيء. المَيْلُ وَالدَّوَرانُ مَعاً يَدْفَعانِ المادَّةَ الرَّطْبَةَ مِنْ طَرَفِ التَّغْذِيَةِ المُرْتَفِعِ إِلى طَرَفِ التَّفْريغِ المُنْخَفِض، بَيْنَما يَجْري الغازُ السّاخِنُ في الاتِّجاهِ نَفْسِه.", "This is the rotating drum, the heart of the dryer. It is eight metres long and one point two metres in diameter, sloped slightly and turning slowly. The slope and the rotation together move the wet material from the raised feed end to the lower discharge end, while the hot gas flows in the same direction."], ["flights", "وَفي داخِلِ الأُسْطُوانَةِ هذِهِ الرَّفّاعات. تَرْفَعُ المادَّةَ مِنَ القاعِ مَعَ الدَّوَران، ثُمَّ تَسْكُبُها عَلى شَكْلِ سَتائِرَ تَسْقُطُ عَبْرَ الغازِ السّاخِن. هذِهِ السَّتائِرُ هِيَ سِرُّ كَفاءَةِ المُجَفِّفِ الدَّوّار، لِأَنَّها تَزيدُ مِساحَةَ التَّلامُسِ بَيْنَ المادَّةِ وَالغازِ زِيادَةً كَبيرَة. لاحِظوا أَنَّ المادَّةَ تَدْخُلُ خَضْراءَ رَطْبَة، وَتَصْفَرُّ كُلَّما جَفَّت.", "Inside the drum are these lifting flights. As the drum turns, they lift the material from the bottom and shower it as curtains through the hot gas. These curtains are the secret of the rotary dryer, because they greatly increase the contact area between solids and gas. Notice that the material enters green and wet, and turns yellow as it dries."], ["tyres", "هاتانِ حَلْقَتا الارْتِكاز. تُحيطانِ بِالأُسْطُوانَة، وَتَنْقُلانِ وَزْنَها كُلَّهُ إِلى البَكَراتِ الحامِلَة.", "These are the two riding rings. They surround the drum and carry its whole weight onto the support rollers."], ["rollers", "وَهذِهِ البَكَراتُ الحامِلَة، تَدورُ مَعَ حَلْقَتَيِ الارْتِكاز. أَمّا البَكَرَةُ المِحْوَرِيَّةُ فَتَمْنَعُ الأُسْطُوانَةَ المائِلَةَ مِنَ الانْزِلاقِ نَحْوَ الأَسْفَل.", "These are the trunnion rollers, which turn with the riding rings. The thrust roller stops the sloped drum from sliding downhill."], ["gear", "هذا هُوَ التُّرْسُ الحَلَقِيُّ الكَبير، يُديرُهُ تُرْسٌ صَغير، فَيَدورُ مَعَهُ المُجَفِّفُ كُلُّه.", "This is the large girth gear. A small pinion drives it, and the whole drum turns with it."], ["drive", "وَهُنا المُحَرِّكُ وَصُنْدوقُ التُّروس، يُخَفِّضانِ سُرْعَةَ المُحَرِّكِ إِلى بِضْعِ دَوَراتٍ في الدَّقيقَةِ فَقَط. وَيُمْكِنُكُمْ تَغْييرُ سُرْعَةِ الدَّوَرانِ مِنَ اللَّوْحَةِ الجانِبِيَّة، لِتَرَوْا أَثَرَها في زَمَنِ المُكوثِ وَكَمِّيَّةِ المادَّةِ داخِلَ الأُسْطُوانَة.", "Here are the motor and gearbox, which reduce the motor speed to just a few revolutions per minute. You can change the drum speed in the side panel and see how it affects residence time and the amount of material in the drum."], ["burner", "هذِهِ حُجْرَةُ الاحْتِراق، مُبَطَّنَةٌ بِالطّوبِ الحَرارِيّ. يَحْتَرِقُ فيها الوَقود، وَيَخْتَلِطُ بِالهَواءِ لِيُعْطِيَنا الغازَ السّاخِنَ بِالحَرارَةِ المَطْلوبَة. الغازُ الأَحْمَرُ الَّذي تَرَوْنَهُ داخِلَ الأُسْطُوانَةِ غازٌ ساخِن، وَيَبْرُدُ تَدْريجِيّاً حَتّى يُصْبِحَ بَنَفْسَجِيّاً عِنْدَ الخُروج.", "This is the combustion chamber, lined with refractory brick. Fuel burns here and mixes with air to give hot gas at the required temperature. The red gas you see in the drum is hot, and it cools gradually to violet at the outlet."], ["feeder", "وَهذا قادوسُ التَّغْذِيَة. تَنْزِلُ مِنْهُ المادَّةُ الرَّطْبَةُ عَبْرَ الصِّمامِ الدَّوّار، ثُمَّ المَجْرى المائِل، إِلى داخِلِ الأُسْطُوانَة.", "This is the feed hopper. The wet material leaves it through the rotary feeder and slides down the chute into the drum."], ["feedHood", "هذا غِطاءُ التَّغْذِيَةِ الثّابِت، يَدْخُلُ مِنْهُ الغازُ السّاخِنُ وَالمادَّةُ الرَّطْبَةُ مَعاً إِلى الأُسْطُوانَةِ الدَّوّارَة.", "This is the stationary feed hood, through which the hot gas and the wet material enter the rotating drum together."], ["dischHood", "وَفي الطَّرَفِ الآخَرِ غِطاءُ التَّفْريغ. تَسْقُطُ فيهِ المادَّةُ الجافَّةُ إِلى الأَسْفَل، وَيَخْرُجُ الغازُ المُحَمَّلُ بِبُخارِ الماءِ وَالغُبارِ مِنْ أَعْلاه.", "At the other end is the discharge hood. The dry material falls to the bottom, and the gas, carrying water vapour and dust, leaves from the top."], ["airlock", "هذا الصِّمامُ الدَّوّارُ يُخْرِجُ المُنْتَجَ الجافَّ إِلى الحاوِيَة، وَيَمْنَعُ دُخولَ الهَواءِ إِلى المُجَفِّف.", "This rotary airlock releases the dry product into the bin and stops air leaking into the dryer."], ["cyclone", "وَهذا الإِعْصار. يَدْخُلُهُ الغازُ مُماسِّيّاً فَيَدورُ بِسُرْعَة، فَيَنْدَفِعُ الغُبارُ الأَصْفَرُ نَحْوَ الجِدارِ وَيَنْزِلُ إِلى الأَسْفَل. أَمّا الغازُ النَّظيفُ فَيَصْعَدُ في الدَّوّامَةِ الدّاخِلِيَّة، وَيَخْرُجُ مِنَ الأَعْلى. تابِعوا الجُسَيْماتِ جَيِّداً، لِتَرَوُا المَسارَيْن.", "And this is the cyclone. Gas enters tangentially and spins fast, so the yellow dust is thrown to the wall and slides down, while the clean gas rises in the inner vortex and leaves from the top. Watch the particles closely to see the two paths."], ["fan", "ثُمَّ مِرْوَحَةُ السَّحْب، تَسْحَبُ الغازَ عَبْرَ المُجَفِّفِ كُلِّه، وَتَطْرُدُهُ إِلى المِدْخَنَة، فَيَبْقى المُجَفِّفُ تَحْتَ ضَغْطٍ سالِبٍ قَليل، يَمْنَعُ تَسَرُّبَ الغُبار.", "Next is the induced draft fan. It draws the gas through the whole dryer and sends it to the stack, keeping the dryer under a slight negative pressure so dust cannot leak out."], ["thermo", "وَأَخيراً مِجَسّا الحَرارَةِ عِنْدَ الدُّخولِ وَالخُروج. حَرارَةُ الغازِ الخارِجِ أَهَمُّ مُتَغَيِّرٍ في التَّحَكُّمِ بِالمُجَفِّف: إِذا انْخَفَضَتْ كَثيراً خَرَجَ المُنْتَجُ رَطْباً، وَإِذا ارْتَفَعَتْ كَثيراً ضاعَتِ الطّاقَة.", "Finally, the gas temperature sensors at the inlet and outlet. Outlet gas temperature is the key control variable: too low and the product leaves wet, too high and energy is wasted."], [null, "وَالآنَ جَرِّبوا بِأَنْفُسِكُم. غَيِّروا حَرارَةَ الغازِ وَمُعَدَّلَ التَّغْذِيَةِ وَسُرْعَةَ الدَّوَرانِ مِنَ اللَّوْحَة، وَراقِبوا رُطوبَةَ المُنْتَجِ وَحَرارَةَ الغازِ الخارِج. حاوِلوا الوُصولَ إِلى مُنْتَجٍ ضِمْنَ المُواصَفَةِ بِأَقَلِّ حَرارَةٍ مُمْكِنَة. بِالتَّوْفيقِ لِلْجَميع.", "Now try it yourselves. Change the gas temperature, the feed rate and the drum speed in the panel, and watch the product moisture and the outlet gas temperature. Try to reach an on-spec product with the lowest possible gas temperature. Good luck to you all."]]};

 const ar=v.filter(x=>/^ar/i.test(x.lang)),ML=/hamed|naayf|shakir|bassel|fahed|taim|rami|moaz|hamdan|\bali\b|saleh|laith|hedi|ismael|jamal|omar|abdullah|maged|majed|tarik|\bmale\b/i,FL=/zariyah|salma|hoda|rana|noura|sana|layla|laila|amal|hala|fatima|maryam|amany|amina|iman|mouna|reem|aysha|\bfemale\b/i,sa=x=>(ML.test(x.name)?100:0)-(FL.test(x.name)?100:0)+(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?2:0)+(/ar[-_]SA/i.test(x.lang)?1:0);arVoice=ar.sort((a,b)=>sa(b)-sa(a))[0]||null;arMale=!!(arVoice&&ML.test(arVoice.name)&&!FL.test(arVoice.name));
 const en=v.filter(x=>/^en/i.test(x.lang)),se=x=>(/natural|neural|online/i.test(x.name)?8:0)+(/google/i.test(x.name)?4:0)+(/ryan|guy|george|daniel|david|arthur|male/i.test(x.name)?3:0)+(/en[-_]GB/i.test(x.lang)?2:0);
 enVoice=en.sort((a,b)=>se(b)-se(a))[0]||null;}
