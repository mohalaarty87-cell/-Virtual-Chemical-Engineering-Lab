<style>

  --bg:#11171c; --stage-a:#223039; --stage-b:#10161b; --panel:#172027; --ink:#e1e8ed; --muted:#94a4af;

}

body{margin:0; height:100%; background:var(--bg); color:var(--ink);

.card{margin:0 16px; padding:16px 18px; background:var(--tint); border-radius:12px; border:1px solid var(--line)}
.card h2{margin:0; font-size:18px; font-weight:600; line-height:1.45}
.card .en{margin:0 0 8px; color:var(--muted); font-size:13px; direction:ltr; text-align:right}
.card p{margin:6px 0}
.card .eq{margin-top:10px; padding:8px 10px; border-inline-start:3px solid var(--accent); background:var(--panel); border-radius:0 6px 6px 0; font-size:14px; unicode-bidi:plaintext}
.card .head{display:flex; gap:10px; align-items:flex-start}
.card .head .num{flex:none; margin-top:3px}
.card .act{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
.card .act button{background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13.5px}
.card .act button:hover{border-color:var(--accent)}

.num{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; font-size:12.5px; font-weight:600;

.mix{padding:18px 22px 6px}
.mix h3,.parts h3{margin:0 0 6px; font-size:15px; font-weight:600}
.rpm{display:flex; align-items:center; gap:12px}

.parts{padding:14px 14px 8px}

.parts ul{list-style:none; margin:0; padding:0}

.parts li button:hover{background:var(--tint)}
.parts li button[aria-current="true"]{background:var(--tint); box-shadow:inset -3px 0 0 var(--accent)}

.lang:hover{border-color:var(--accent)}

.stage{position:relative; overflow:hidden; background:radial-gradient(ellipse 70% 65% at 50% 42%, var(--stage-a), var(--stage-b))}
#c{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
#c:active{cursor:grabbing}
.labels{position:absolute; inset:0; pointer-events:none}
.lbl{direction:ltr; position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0; border:0; background:none; cursor:pointer; white-space:nowrap}
.lbl .t{direction:rtl; display:none; background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:12.5px; box-shadow:0 1px 3px rgba(20,30,40,.18)}
.labels.names .lbl .t,.lbl.on .t{display:inline-block}

.lbl.on .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lbl.on .t{border-color:var(--accent)}
.labels.off .lbl:not(.on){display:none}

.ovl{position:absolute; top:14px; inset-inline-start:16px; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:8px}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-radius:10px; padding:5px 12px; font-size:13px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:11px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.legend b{font-weight:500}
.tb.rx{background:#1f8a4c; color:#fff; border-color:#1f8a4c; font-weight:600}
.tb.rx[aria-pressed="true"]{background:#b3362b; border-color:#b3362b; color:#fff}
.rxbar{display:flex; height:12px; border-radius:6px; overflow:hidden; margin:8px 0 4px; background:var(--line)}
.rxbar div{transition:width .25s linear}
.brand{ background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--line); border-inline-start:4px solid var(--accent); border-radius:10px; padding:8px 14px 9px}
.brand .who{font-size:17px; font-weight:700; line-height:1.4}
.brand .en{font-size:13px; color:var(--muted); direction:ltr; text-align:right}
.brand .org{font-size:12.5px; color:var(--muted)}
.hint{position:absolute; top:14px; inset-inline-end:16px; max-width:300px; font-size:13px; color:var(--muted); pointer-events:none}
.toolbar{position:absolute; bottom:14px; inset-inline:14px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; pointer-events:none}
.toolbar > *{pointer-events:auto}
.tb{background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:6px 13px; cursor:pointer; font-size:13.5px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.tb:hover{border-color:var(--accent)}
.tb[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.seg{display:inline-flex; background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:2px; box-shadow:0 1px 3px rgba(20,30,40,.12)}
.seg button{border:0; background:none; padding:4px 11px; border-radius:7px; cursor:pointer; font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:15px; padding:20px; text-align:center}

html[dir="ltr"] .ph .sub,html[dir="ltr"] .card .en,html[dir="ltr"] .brand .en{direction:rtl; text-align:left}
html[dir="ltr"] .readout dd{text-align:right}
html[dir="rtl"] #oReg{direction:rtl}

html[dir="ltr"] .parts li button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}

html[dir="ltr"] .card .eq{border-radius:0 6px 6px 0}
html[dir="rtl"] .card .eq{border-radius:6px 0 0 6px}

.prof .tr{height:9px; background:var(--line); border-radius:5px; overflow:hidden}

.legend i.grad{width:34px; border-radius:6px; background:linear-gradient(90deg,#f2c21b,#e23b32)}

}

.tb.fl[aria-pressed="true"]{background:#b3362b; color:#fff}
.fwarn{background:#b3362b; color:#fff; border-radius:10px; padding:6px 12px; font-size:13.5px; font-weight:600; max-width:340px; box-shadow:0 2px 8px rgba(120,20,10,.3)}

.card.fcard{border-color:#b3362b; border-inline-start:4px solid #b3362b}

.pkseg{display:flex; width:100%}

#chart2 svg{width:100%;height:auto;display:block;margin-top:8px}#chart2 text{font-size:10px;fill:var(--muted);font-family:inherit}

#tbl table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}#tbl th,#tbl td{border:1px solid rgba(128,128,128,.35);padding:2px 4px;text-align:center}#tbl th{background:rgba(31,78,120,.25)}#tbl .osc{color:#c8352e;font-weight:700}

#tbl .sc{max-height:170px;overflow:auto;border:1px solid rgba(128,128,128,.35)}#tbl .sc table{margin:0}
.presenter{position:absolute; top:12px; inset-inline-end:12px; width:min(290px,calc(100% - 24px)); display:flex; gap:9px; align-items:flex-start; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:8px 9px; box-shadow:0 4px 16px rgba(10,20,30,.2); z-index:5}
.presenter[hidden]{display:none}
.pv{position:relative; flex:none; width:52px; height:52px}
.pv img{width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:50% 30%; position:relative; z-index:1; border:2px solid var(--panel)}
.pv .ring{position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(#1f8a4c,#1f78c8,#1f8a4c); opacity:.35}
.presenter.talking .pv img{animation:talk 2.4s ease-in-out infinite}
.presenter.talking .pv .ring{opacity:1; animation:spin 3s linear infinite}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-1px) scale(1.02) rotate(-.6deg)}50%{transform:translateY(0) scale(1.005)}75%{transform:translateY(-1px) scale(1.015) rotate(.6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pv .bars{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:2; background:var(--panel); border-radius:6px; padding:2px 4px; border:1px solid var(--line)}
.pv .bars i{display:block; width:2px; height:4px; background:#1f8a4c; border-radius:2px}
.presenter.talking .bars i{animation:bar .9s ease-in-out infinite}
.presenter.talking .bars i:nth-child(2){animation-delay:.15s}.presenter.talking .bars i:nth-child(3){animation-delay:.3s}.presenter.talking .bars i:nth-child(4){animation-delay:.45s}.presenter.talking .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:3px}50%{height:10px}}
.pb{flex:1; min-width:0}
.pn{font-weight:700; font-size:12.5px; line-height:1.3}

.pbtn img{width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 30%}
.pbtn span{position:absolute; bottom:-3px; inset-inline-end:-3px; width:18px; height:18px; border-radius:50%; background:#1f8a4c; color:#fff; font-size:9px; display:grid; place-items:center}
.pbtn[hidden]{display:none}
.stage.tour .hint{display:none}

.stage .hint{inset-inline-end:70px}
.wm{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;user-select:none;font:600 11px/1.2 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;opacity:.5;text-shadow:0 0 3px rgba(0,0,0,.85),0 0 1px #000;white-space:nowrap;letter-spacing:.2px}

<body>
<div class="app">
  <aside class="panel">
    <header class="ph">
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <button class="lang" data-lang-toggle>English</button>
    </header>
    <section class="card" id="card" aria-live="polite"></section>
    <section class="mix">
      <h3 data-t="opMode"></h3>
      <div class="seg pkseg" role="group">
        <button data-md="step" aria-pressed="true"></button>
        <button data-md="puls" aria-pressed="false"></button>
      </div>
      <h3 data-t="opA" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="pa" min="1" max="4" step="1" value="2" aria-label="Valve position A"><output id="paOut">–</output></div>
      <h3 data-t="opB" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="pb" min="1" max="4" step="1" value="3" aria-label="Valve position B"><output id="pbOut">–</output></div>
      <h3 data-t="opD" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="dd" min="2" max="12" step="0.1" value="7" aria-label="Tube diameter"><output id="ddOut">–</output></div>
      <h3 data-t="opMu" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="mu" min="1.5" max="60" step="0.5" value="16" aria-label="Viscosity"><output id="muOut">–</output></div>
      <h3 data-t="opL" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="ll" min="30" max="80" step="1" value="48" aria-label="Column length"><output id="llOut">–</output></div>
      <h3 data-t="opFp" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="fp" min="0.1" max="3" step="0.05" value="0.8" aria-label="Pulsation frequency"><output id="fpOut">–</output></div>
      <h3 data-t="opAm" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="am" min="2" max="40" step="1" value="15" aria-label="Pulsation amplitude"><output id="amOut">–</output></div>
      <h3 data-t="opSm" style="margin-top:12px"></h3>
      <div class="seg pkseg" role="group">
        <button data-sm="0.1" aria-pressed="true">0.1 s</button>
        <button data-sm="0.5" aria-pressed="false">0.5 s</button>
        <button data-sm="1" aria-pressed="false">1 s</button>
      </div>
      <h3 data-t="opRe" style="margin-top:10px"></h3>
      <div class="seg pkseg" role="group">
        <button data-re="ideal" aria-pressed="false"></button>
        <button data-re="real" aria-pressed="true"></button>
      </div>
      <h3 data-t="opSpd" style="margin-top:10px"></h3>
      <div class="rpm"><input type="range" id="sd" min="-1.3" max="0.3" step="0.05" value="-0.3" aria-label="Simulation speed"><output id="sdOut">–</output></div>
      <dl class="readout">
        <dt data-t="dSig"></dt><dd id="oSig">–</dd>
        <dt data-t="dPar"></dt><dd id="oPar">–</dd>
        <dt data-t="dTh"></dt><dd id="oTh">–</dd>
        <dt data-t="dEx"></dt><dd id="oEx">–</dd>
        <dt data-t="dFr"></dt><dd id="oFr">–</dd>
        <dt data-t="dPu"></dt><dd id="oPu">–</dd>
        <dt data-t="dCal"></dt><dd id="oCal">–</dd>
        <dt data-t="dDes"></dt><dd id="oDes">–</dd>
        <dt data-t="dTm"></dt><dd id="oTm">–</dd>
      </dl>

  fine:'محاكاة للتجربة 3 (نظام الرتبة الثانية ناقص التخميد بمانومتر U موصول بفتحة) بحسب دليل مختبر السيطرة على العمليات (الجامعة التكنولوجية، إعداد سناء وثيق ونسمة بلاسم، إشراف د. زيدون محسن)، مع تحليل من كتاب المحاضرات (د. زيدون محسن شكور): النظام من الرتبة الثانية (المحاضرة 7)، والاستجابة الترددية ومخططات بودي (13). ما أُخذ من الدليل: معادلة توازن القوى (3) ودالة التحويل h(s)/ΔP(s)، والمعطيات L = 0.48 m وμ = 0.016 kg/m·s وd = 7 mm، وأوضاع الصمام 1–4 والخطوة الصاعدة والهابطة، وh_Hg = 2h والتسجيل بالثواني، وحساب التجاوز ونسبة الاضمحلال وزمن الصعود والدورة والدورة الطبيعية، ومنحنى المعايرة Q–ΔP مع ΔP = ρ·g·2h. ما افترضته لأن الدليل لا يعطيه، فهو افتراضي وليس قياساً على الجهاز: تدفقات الأوضاع 8 و12 و16 و20 L/min، وأنبوب 25 mm وفتحة 12 mm ومعامل تصريف 0.61، وزئبق 13600 kg/m³ تحته ماء 1000 kg/m³، وفي «النموذج الواقعي» تأخر للصمام والخط 0.25 s واحتكاك مضطرب c = 3000 Pa/(m/s)². تنبيه على الدليل: صيغة معامل التخميد المطبوعة φ = [16μL/(g·d²·ρ)]·√(L/2g) غير متسقة أبعادياً، فجزؤها الأول وحدته ثانية وضربه في √(L/2g) (ثانية) يعطي ثانية² بينما φ بلا أبعاد. والصحيح الناتج عن معادلة القوى (3) نفسها: φ = 8μL/(ρ·g·d²·τ) مع τ = √(ρm·L/(2Δρ·g)). وبمعطيات الدليل تعطي المطبوعة φ = 0.0032 (تجاوز متوقع 99%) والمشتقة φ = 0.062 (تجاوز 82%). كذلك μ = 0.016 يبلغ نحو عشرة أضعاف لزوجة الزئبق الحقيقية (0.0016 تقريباً)، ولو استُعملت لصار φ نحو 0.006، فالأرقام هنا للمعطيات كما كُتبت. التحقق: التكامل العددي يطابق الحل التحليلي لنظام الرتبة الثانية إلى 2×10⁻⁸ mm، والتجاوز المحاكى 82.16% يطابق النظرية 82.16%، ونسبة الاضمحلال 0.6748 مقابل 0.6750، والذروة الرنينية M_r = 8.03 تطابق 1/(2ζ√(1−ζ²))، والقطر الذي يعطي ζ = 0.7 يتحقق منه الحساب العكسي. وفاصل التسجيل 1 s مع دورة 1.02 s يخفي الاهتزاز تماماً.',

  pick:'<h2>لماذا يتذبذب الزئبق؟</h2><p>عند تغيير وضع الصمام تقفز ΔP فجأة، فيتحرك عمود الزئبق كله بقصوره الذاتي ويتجاوز موضع الاتزان ثم يعود، لأن وزن الزئبق يعمل كنابض والاحتكاك ضعيف. اضغط «تطبيق الخطوة» وشاهد الساقين.</p><p>زد اللزوجة أو صغّر القطر لتزيد التخميد، وجرّب «اضبط التخميد ζ = 0.7» لأسرع استقرار بتجاوز صغير، ثم جرّب التدفق النابض قرب التردد الرنيني لترى المانومتر يضخم النبض.</p>',

  fine:'A simulation of experiment 3 (an underdamped second-order system with a U-tube manometer on an orifice) according to the Process Control Laboratory manual (University of Technology, prepared by Sana Wathiq and Nesma Balasim, supervised by Dr. Zaidoon Mohsin), with analysis from the lecture book (Dr. Zaidoon M. Shakoor): the second-order system (lecture 7) and frequency response with Bode diagrams (13). Taken from the manual: the force-balance equation (3) and the transfer function h(s)/ΔP(s), the data L = 0.48 m, μ = 0.016 kg/m·s and d = 7 mm, valve positions 1–4 with the rising and falling steps, h_Hg = 2h and recording in seconds, calculating overshoot, decay ratio, rise time, period and natural period, and the Q–ΔP calibration curve with ΔP = ρ·g·2h. What I assumed because the manual does not give it, so it is assumed and not measured on the apparatus: the position flows 8, 12, 16 and 20 L/min, a 25 mm pipe with a 12 mm orifice and a discharge coefficient of 0.61, mercury of 13600 kg/m³ under water of 1000 kg/m³, and in the “realistic model” a valve-and-line lag of 0.25 s and turbulent friction c = 3000 Pa/(m/s)². A note on the manual: the printed damping-ratio formula φ = [16μL/(g·d²·ρ)]·√(L/2g) is not dimensionally consistent: its first factor has units of seconds and multiplying it by √(L/2g) (seconds) gives seconds², whereas φ is dimensionless. The correct one that follows from the force balance (3) itself is φ = 8μL/(ρ·g·d²·τ) with τ = √(ρm·L/(2Δρ·g)). With the manual’s data the printed one gives φ = 0.0032 (an expected overshoot of 99%) and the derived one φ = 0.062 (82% overshoot). Also μ = 0.016 is about ten times the real viscosity of mercury (roughly 0.0016), and with it φ would be about 0.006, so the numbers here are for the data as written. Verification: the numerical integration matches the analytic second-order solution to 2×10⁻⁸ mm, the simulated overshoot of 82.16% matches the theory (82.16%), the decay ratio is 0.6748 against 0.6750, the resonance peak M_r = 8.03 matches 1/(2ζ√(1−ζ²)), and the diameter that gives ζ = 0.7 checks by the inverse calculation. A recording interval of 1 s with a period of 1.02 s hides the oscillation completely.',

const V3=THREE.Vector3,V2=THREE.Vector2,UP=new V3(0,1,0);
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const stage=document.getElementById('stage'),canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.localClippingEnabled=true;renderer.setClearColor(0,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.05,160);
const HOME={pos:new V3(5.3,5.0,19.0),tgt:new V3(5.3,3.6,0)};camera.position.copy(HOME.pos);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.copy(HOME.tgt);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=1;controls.maxDistance=46;
controls.enablePan=true;controls.screenSpacePanning=true;controls.panSpeed=1.1;
controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
canvas.addEventListener('contextmenu',e=>e.preventDefault());controls.update();
(function(){const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();
 const g=new THREE.SphereGeometry(20,48,24),pos=g.attributes.position,cols=[];
 const lo=new THREE.Color(0x4a525a),mid=new THREE.Color(0xb8c2ca),hi=new THREE.Color(0xf2f6f9);
 for(let i=0;i<pos.count;i++){const y=pos.getY(i)/20;const c=y<0?lo.clone().lerp(mid,y+1):mid.clone().lerp(hi,y);cols.push(c.r,c.g,c.b);}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({side:THREE.BackSide,vertexColors:true})));
 const pl=(w,h,p,k)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k,k),side:THREE.DoubleSide}));m.position.copy(p);m.lookAt(0,0,0);es.add(m);};
 pl(14,4,new V3(0,14,6),3.2);pl(6,10,new V3(-15,4,-4),2.2);pl(6,10,new V3(15,5,2),1.6);
 scene.environment=pm.fromScene(es,.04).texture;pm.dispose();})();
scene.add(new THREE.HemisphereLight(0xeef3f7,0x3a4550,.55));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:11,bottom:-5,near:1,far:50});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun);
const fill=new THREE.DirectionalLight(0xdfe8ff,.35);fill.position.set(-8,5,-6);scene.add(fill);


const std=(hex,met,rough,extra)=>new THREE.MeshStandardMaterial(Object.assign({color:C(hex),metalness:met,roughness:rough,side:THREE.DoubleSide},extra||{}));
const M={steel:std(0xd4dbe0,.9,.25),steelDark:std(0x8e989f,.85,.36),brushed:std(0xb9c2c9,.85,.4),
 paint:std(0x2f5f86,.25,.48),paintGrey:std(0x5b6873,.35,.55),yellowPaint:std(0xd9a91c,.2,.5),black:std(0x2b3035,.3,.6),
 red:std(0xb3362b,.2,.42),orange:std(0xc9772c,.2,.45),blue:std(0x2f7fe6,.2,.45),purple:std(0x7b2fbf,.2,.45),grey:std(0x9aa3aa,.2,.5),white:std(0xf3f3ee,0,.5),
 ceramic:std(0xd8d2c6,0,.75),saddleC:std(0xeae6dc,0,.6),gasBand:std(0xff6a00,.2,.45),cyan:std(0x14c8f0,.2,.45),navy:std(0x1a2cb0,.2,.45),glass:std(0x9fd6ea,0,.05,{transparent:true,opacity:.42})};
const meshTex=(function(){const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');x.fillStyle='#8f989f';x.fillRect(0,0,64,64);
 x.strokeStyle='#d9dfe3';x.lineWidth=1.2;for(let i=-64;i<128;i+=5){x.beginPath();x.moveTo(i,0);x.lineTo(i+64,64);x.stroke();x.beginPath();x.moveTo(i,64);x.lineTo(i+64,0);x.stroke();}
 const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);t.encoding=THREE.sRGBEncoding;return t;})();
M.mesh=new THREE.MeshStandardMaterial({map:meshTex,metalness:.6,roughness:.6,side:THREE.DoubleSide});

function add(g,geo,mat,pos){const m=new THREE.Mesh(geo,mat);if(pos)m.position.copy(pos);g.add(m);return m;}
function cylY(g,r,y0,y1,mat,x,z,seg,open){return add(g,new THREE.CylinderGeometry(r,r,y1-y0,seg||40,1,!!open),mat,new V3(x||0,(y0+y1)/2,z||0));}
function pipe(g,p1,p2,r,mat,seg){const d=new V3().subVectors(p2,p1),L=d.length();const m=add(g,new THREE.CylinderGeometry(r,r,L,seg||24),mat);m.position.copy(p1).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UP,d.normalize());return m;}
function ball(g,p,r,mat){return add(g,new THREE.SphereGeometry(r,24,16),mat,p);}
function box(g,w,h,d,p,mat,ry){const m=add(g,new THREE.BoxGeometry(w,h,d),mat,p);if(ry)m.rotation.y=ry;return m;}
function flange(g,p,dir,rd,n,mat){const f=new THREE.Group();f.position.copy(p);f.quaternion.setFromUnitVectors(UP,dir.clone().normalize());
 add(f,new THREE.CylinderGeometry(rd,rd,.035,40),mat||M.steel);const bg=new THREE.CylinderGeometry(.01,.01,.07,8);
 for(let i=0;i<n;i++){const a=(i+.5)/n*Math.PI*2;add(f,bg,M.steelDark,new V3(Math.cos(a)*rd*.8,0,Math.sin(a)*rd*.8));}g.add(f);return f;}
const FLOWS=[];
function line(g,pts,r,mat,colorFn,speed){for(let i=0;i<pts.length-1;i++)pipe(g,pts[i],pts[i+1],r,mat);for(let i=1;i<pts.length-1;i++)ball(g,pts[i],r,mat);if(colorFn)FLOWS.push({pts,colorFn,speed:speed||.9});}
function band(g,p1,p2,r,mat){pipe(g,p1,p2,r,mat);}
function arrow(g,p,dir,mat){const a=add(g,new THREE.ConeGeometry(.07,.16,20),mat,p);a.quaternion.setFromUnitVectors(UP,dir.clone().normalize());return a;}
function valve(g,p,dir,r){ball(g,p,r*1.9,M.steel);const d=dir.clone().normalize();flange(g,p.clone().addScaledVector(d,r*2.2),d,r*2,6);flange(g,p.clone().addScaledVector(d,-r*2.2),d,r*2,6);
 cylY(g,r*.35,p.y,p.y+r*4,M.steelDark,p.x,p.z,12);box(g,r*7,r*.5,r*.8,new V3(p.x,p.y+r*4,p.z),M.red);}
function ctrlValve(g,p,dir,r){ball(g,p,r*1.9,M.steel);const d=dir.clone().normalize();flange(g,p.clone().addScaledVector(d,r*2.2),d,r*2,6);flange(g,p.clone().addScaledVector(d,-r*2.2),d,r*2,6);
 const up=Math.abs(d.y)>.9?new V3(1,0,0):UP;const top=p.clone().addScaledVector(up,r*5);pipe(g,p,top,r*.4,M.steelDark,12);
 const dm=add(g,new THREE.SphereGeometry(r*3,28,14,0,Math.PI*2,0,Math.PI/2),M.paint,top);dm.quaternion.setFromUnitVectors(UP,up);dm.scale.y=.55;}
function pump(g,x,z,y,mat){box(g,.34,.06,.95,new V3(x,.03,z+.3),M.paintGrey);
 const v=add(g,new THREE.CylinderGeometry(.17,.17,.13,32),mat,new V3(x,y,z));v.rotation.x=Math.PI/2;
 pipe(g,new V3(x,y,z-.06),new V3(x,y,z-.2),.05,M.steel);flange(g,new V3(x,y,z-.2),new V3(0,0,1),.1,4);pipe(g,new V3(x,y+.1,z),new V3(x,y+.24,z),.045,M.steel);
 const br=add(g,new THREE.CylinderGeometry(.07,.09,.18,20),M.paintGrey,new V3(x,y,z+.16));br.rotation.x=Math.PI/2;
 const cp=add(g,new THREE.CylinderGeometry(.05,.05,.07,16),M.orange,new V3(x,y,z+.29));cp.rotation.x=Math.PI/2;
 const mo=add(g,new THREE.CylinderGeometry(.14,.14,.4,28),mat,new V3(x,y,z+.53));mo.rotation.x=Math.PI/2;
 const fc=add(g,new THREE.CylinderGeometry(.13,.14,.08,28),M.paintGrey,new V3(x,y,z+.76));fc.rotation.x=Math.PI/2;
 box(g,.1,.1,.12,new V3(x,y+.17,z+.5),mat);[-1,1].forEach(s=>box(g,.05,y-.1,.3,new V3(x+s*.1,(y-.1)/2+.06,z+.5),M.paintGrey));box(g,.08,y-.12,.08,new V3(x,(y-.12)/2+.06,z),M.paintGrey);}
function vesselProfile(r,hd,y0,y1){const pts=[],N=32;for(let i=0;i<=N;i++){const t=i/N*Math.PI/2;pts.push(new V2(Math.max(1e-4,r*Math.sin(t)),y0-hd*Math.cos(t)));}

const CFG={btn:"bRun",isOn:()=>running,tour:[[null, "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ. أَنا الدُّكْتورْ ضِياءْ جُمْعَة جاسِمْ، تَدْريسِيٌّ في قِسْمِ الهَنْدَسَةِ الكيمْياوِيَّةِ وَالصِّناعاتِ النِّفْطِيَّةِ في كُلِّيَّةِ العَمارَةِ الجامِعَة، وَأُدَرِّسُ مادَّتَيِ انْتِقالِ الكُتْلَةِ وَتَصْميمِ المُفاعِلات. أَهْلاً بِكُمْ في هذا المُحاكي ثُلاثِيِّ الأَبْعادِ لِنِظامِ الرُّتْبَةِ الثّانِيَةِ ناقِصِ التَّخْميدِ، مانومِتْرِ الأُنْبوبِ يو. سَأُعَرِّفُكُمْ عَلى أَجْزائِهِ الرَّئيسَة، ثُمَّ نُشاهِدُ مَعاً لِماذا يَتَذَبْذَبُ الزِّئْبَقُ بَعْدَ تَغْييرِ التَّدَفُّق، وَكَيْفَ نَتَحَكَّمُ في تَخْميدِه.", "Hello and welcome. I am Doctor Dheyaa J. Jasim, a lecturer in the Department of Chemical Engineering and Petroleum Industries at Al-Amarah University College, where I teach Mass Transfer and Reactor Design. Welcome to this three-dimensional simulator of the underdamped second-order U-tube manometer. I will introduce its main parts, and then we will watch together why the mercury oscillates after a flow change, and how we control its damping."], ["supply", "تَدْفَعُ المِضَخَّةُ الماءَ في الأُنْبوبِ بِتَدَفُّقٍ ثابِتٍ لِكُلِّ وَضْعٍ مِن أَوْضاعِ الصِّمام.", "The pump drives the water through the pipe at a constant flow for each valve position."], ["valve", "وَبِالانْتِقالِ مِن وَضْعٍ إِلى آخَرَ يَحْدُثُ تَغْييرٌ مُفاجِئٌ في التَّدَفُّق، أَيْ خُطْوَة.", "Moving from one position to another makes a sudden change in the flow, a step."], ["orifice", "عِنْدَ الفُتْحَةِ يَنْشَأُ فَرْقُ ضَغْطٍ يَتَناسَبُ مَعَ مُرَبَّعِ التَّدَفُّق، وَيَنْتَقِلُ إِلى قِمَّتَيِ المانومِتْر.", "At the orifice a pressure difference arises proportional to the square of the flow, and it is carried to the tops of the manometer."], ["utube", "وَهُنا الزِّئْبَق. عَمودُهُ كُلُّهُ يَتَحَرَّكُ كَجِسْمٍ واحِد: لَهُ قُصورٌ ذاتِيٌّ كَالكُتْلَة، وَوَزْنُهُ يَعْمَلُ كَنابِض، وَاللُّزوجَةُ احْتِكاكٌ ضَعيف. لِذلِكَ يَتَجاوَزُ مَوْضِعَ الاتِّزانِ وَيَتَذَبْذَبُ.", "Here is the mercury. Its whole column moves as one body: it has inertia like a mass, its weight acts as a spring, and the viscosity is weak friction. So it overshoots the equilibrium and oscillates."], ["scale", "وَنَقْرَأُ الفَرْقَ في الارْتِفاعِ مِن هذِهِ المِسْطَرَة. وَالدَّوْرَةُ نَحْوُ ثانِيَةٍ، فَإِذا كانَ فاصِلُ القِراءَةِ ثانِيَةً ضاعَتِ الذَّبْذَبَةُ مِنَ القِراءات.", "We read the height difference from this ruler. The period is about one second, so if the reading interval is one second the oscillation is lost from the readings."], ["meter", "وَيُعْطي هذا المِقْياسُ التَّدَفُّقَ، وَمِنْهُ نَرْسُمُ مُنْحَنى المُعايَرَة.", "This meter gives the flow, from which we draw the calibration curve."], ["pc", "وَفي الشَّريطِ الجانِبِيِّ مُخَطَّطُ بودي: يُبَيِّنُ تَضْخيمَ المانومِتْرِ لِلتَّدَفُّقِ النّابِضِ قُرْبَ تَرَدُّدِ الرَّنين.", "The side panel holds the Bode diagram, which shows the manometer amplifying a pulsating flow near the resonant frequency."], [null, "جَرِّبوا الآنَ: اضْغَطوا تَطْبيقَ الخُطْوَةِ وَقارِنوا التَّجاوُزَ بِالنَّظَرِيَّة. ثُمَّ اضْبُطوا التَّخْميدَ عَلى صِفْرٍ فاصِلَةٍ سَبْعَة، وَشاهِدوا كَيْفَ يَتَلاشى الاهْتِزاز. وَجَرِّبوا التَّدَفُّقَ النّابِضَ عِنْدَ تَرَدُّدِ الرَّنين. بِالتَّوْفيقِ لِلْجَميع.", "Now try it yourselves: press apply the step and compare the overshoot with the theory. Then set the damping to zero point seven and watch the oscillation fade. And try the pulsating flow at the resonant frequency. Good luck to you all."]]};
